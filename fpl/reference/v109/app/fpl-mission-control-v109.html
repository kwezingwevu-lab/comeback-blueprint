<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FPL Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F2F6F0; --surface:#FFFFFF; --surface2:#E8EFE7; --ink:#0F231A; --ink2:#496054; --line:#D3DDD4;
  --pitch1:#2F7D4F; --pitch2:#2A7248; --chalk:rgba(255,255,255,.55); --chip:#FFFFFF; --chipInk:#0F231A;
  --classic:#9A5600; --classicBg:#FFF0D2; --draft:#075F8F; --draftBg:#DCF0FA;
  --good:#1B7441; --warn:#8A6100; --bad:#B3261E; --focus:#0A6A9E;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1A13; --surface:#11261C; --surface2:#183424; --ink:#EEF4EE; --ink2:#A7BCAE; --line:#264635;
  --pitch1:#1E5A38; --pitch2:#1A5032; --chalk:rgba(255,255,255,.35); --chip:#0E2017; --chipInk:#EEF4EE;
  --classic:#FFB627; --classicBg:#3A2C0A; --draft:#5CC8FF; --draftBg:#0D2E40;
  --good:#7BE495; --warn:#F5D90A; --bad:#FF8A8A; --focus:#5CC8FF; } }
:root[data-theme="dark"]{
  --bg:#0B1A13; --surface:#11261C; --surface2:#183424; --ink:#EEF4EE; --ink2:#A7BCAE; --line:#264635;
  --pitch1:#1E5A38; --pitch2:#1A5032; --chalk:rgba(255,255,255,.35); --chip:#0E2017; --chipInk:#EEF4EE;
  --classic:#FFB627; --classicBg:#3A2C0A; --draft:#5CC8FF; --draftBg:#0D2E40;
  --good:#7BE495; --warn:#F5D90A; --bad:#FF8A8A; --focus:#5CC8FF; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px 72px}
.num,.big,h1,h2,h3,.tab{font-family:var(--display);letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 10px}
.mast h1{margin:0;font-size:2.1rem;line-height:.95;font-weight:700;text-transform:none}
.mast .stamp{color:var(--ink2);font-size:.85rem;text-align:right}
.mast .stamp b{color:var(--ink);font-weight:600}
.helpbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.helpbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -14px;padding:6px 14px 0;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:10px 12px 9px;font-size:1.12rem;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab.c[aria-selected="true"]{color:var(--classic);border-bottom-color:var(--classic)}
.tab.d[aria-selected="true"]{color:var(--draft);border-bottom-color:var(--draft)}

/* sections */
section{margin-top:22px}
h2{font-size:1.55rem;margin:0 0 4px;font-weight:700;line-height:1.05}
h3{font-size:1.2rem;margin:0 0 6px;font-weight:600}
.lede{color:var(--ink2);margin:0 0 12px;max-width:68ch}
.help{display:none;color:var(--ink2);font-size:.92rem;margin:2px 0 10px;max-width:68ch;border-left:3px solid var(--line);padding-left:10px}
.explain .help{display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel.c{border-top:4px solid var(--classic)} .panel.d{border-top:4px solid var(--draft)}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.tag{display:inline-block;font-family:var(--display);font-weight:600;font-size:1rem;padding:1px 9px;border-radius:6px}
.tag.c{background:var(--classicBg);color:var(--classic)} .tag.d{background:var(--draftBg);color:var(--draft)}
.muted{color:var(--ink2)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.small{font-size:.88rem}

/* the deadline board */
.board{background:linear-gradient(180deg,var(--pitch1),var(--pitch2));color:#fff;border-radius:18px;padding:18px 16px 16px;position:relative;overflow:hidden}
.board:before{content:"";position:absolute;right:-120px;top:-120px;width:240px;height:240px;border:2px solid var(--chalk);border-radius:50%}
.board:after{content:"";position:absolute;right:-6px;top:-6px;width:22px;height:22px;border:2px solid var(--chalk);border-radius:50%}
.board>*{position:relative;z-index:1}
.board .kicker{font-size:1rem;opacity:.9;margin:0}
.board .big{font-size:clamp(2.6rem,11vw,4.6rem);font-weight:700;line-height:.95;margin:2px 0 4px}
.board .when{margin:0;opacity:.92}
.fxlist{display:grid;grid-template-columns:1fr;gap:6px;margin-top:14px}
@media(min-width:760px){.fxlist{grid-template-columns:1fr 1fr}}
.fxrow{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border-radius:10px;padding:7px 10px;font-size:.95rem}
.fxrow .t{font-family:var(--display);font-weight:600;font-size:1.1rem;white-space:nowrap;flex:0 0 auto}
.fxrow .ko{opacity:.85;font-size:.85rem;white-space:nowrap;flex:0 0 auto}
.fxrow .mine{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto;justify-content:flex-end}
.dot{font-size:.78rem;padding:1px 7px;border-radius:999px;font-weight:600;white-space:nowrap}
.dot.c{background:#FFB627;color:#2A1B00} .dot.d{background:#5CC8FF;color:#03212F}

/* steps */
ol.steps{margin:8px 0 0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 38px;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--surface2);font-family:var(--display);font-weight:700;display:flex;align-items:center;justify-content:center}
ol.steps li b{font-weight:600}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
@media(min-width:620px){.strip{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.stat .k{color:var(--ink2);font-size:.82rem}
.stat .v{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.05}
.stat .s{color:var(--ink2);font-size:.8rem}

/* pitch */
.pitch{background:repeating-linear-gradient(180deg,var(--pitch1) 0 64px,var(--pitch2) 64px 128px);border-radius:16px;padding:12px 6px 10px;position:relative;overflow:hidden}
.pitch:before{content:"";position:absolute;left:12%;right:12%;top:0;height:46px;border:2px solid var(--chalk);border-top:0}
.pitch:after{content:"";position:absolute;left:50%;bottom:-56px;width:112px;height:112px;margin-left:-56px;border:2px solid var(--chalk);border-radius:50%}
.prow{display:flex;justify-content:space-evenly;gap:4px;margin:8px 0;position:relative;z-index:1}
.pchip{background:var(--chip);color:var(--chipInk);border-radius:10px;padding:5px 6px 4px;min-width:0;flex:1 1 0;max-width:118px;text-align:center;border:1px solid rgba(0,0,0,.18);position:relative}
.pchip .nm{font-weight:600;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .fx{font-size:.72rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .ep{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1}
.pchip .arm{position:absolute;top:-7px;right:-5px;background:var(--ink);color:var(--bg);border-radius:50%;width:20px;height:20px;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.bench{display:flex;gap:4px;margin-top:8px;background:var(--surface2);border-radius:12px;padding:8px 6px}
.bench .pchip{background:var(--surface)}
.card{display:inline-block;width:9px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:3px}
.card.y{background:#F5D90A;border:1px solid rgba(0,0,0,.35)} .card.r{background:#E5484D;border:1px solid rgba(0,0,0,.35)}

/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th{font-weight:600;text-align:left;color:var(--ink2);font-size:.82rem;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.me td{background:var(--surface2);font-weight:600}
.club{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0;border:1px solid rgba(0,0,0,.25)}
.swap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.swap:first-of-type{border-top:0}
.swap .arrow{font-family:var(--display);font-weight:700;color:var(--ink2)}
.swap .gain{grid-column:1/-1;font-size:.88rem;color:var(--ink2)}
.swap .who b{font-weight:600}

/* bars */
.bar3{display:flex;height:28px;border-radius:8px;overflow:hidden;font-family:var(--display);font-weight:700;margin:8px 0 4px}
.bar3>div{display:flex;align-items:center;justify-content:center;min-width:34px;font-size:1rem;white-space:nowrap}
.bar3 .w{background:var(--good);color:var(--bg)} .bar3 .dr{background:var(--surface2);color:var(--ink)} .bar3 .l{background:var(--bad);color:var(--bg)}
.range{position:relative;height:30px;margin:6px 0 2px}
.range .track{position:absolute;left:0;right:0;top:13px;height:4px;background:var(--surface2);border-radius:2px}
.range .band{position:absolute;top:9px;height:12px;border-radius:6px;opacity:.85}
.range .mid{position:absolute;top:4px;width:3px;height:22px;border-radius:2px;background:var(--ink)}
.range.c .band{background:var(--classic)} .range.d .band{background:var(--draft)} .range.o .band{background:var(--ink2)}
.legend{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink2)}

/* ticker */
.tick td{padding:3px;border:0;text-align:center}
.tick td.tm{text-align:left;font-family:var(--display);font-weight:700;font-size:1.05rem;white-space:nowrap;padding-right:8px}
.cell{display:block;border-radius:6px;padding:4px 2px;font-size:.78rem;font-weight:600;min-width:46px;line-height:1.15}
.e1{background:#1B7441;color:#fff}.e2{background:#6FBF8B;color:#072414}.e3{background:var(--surface2);color:var(--ink)}.e4{background:#E9A29C;color:#3A0906}.e5{background:#B3261E;color:#fff}

/* controls */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 11px;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=text],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=number]{width:88px}
.note{background:var(--surface2);border-radius:10px;padding:9px 11px;font-size:.92rem;margin:8px 0}
.note.flag{border-left:4px solid var(--warn)}
ul.plain{margin:6px 0 0;padding-left:18px} ul.plain li{margin:4px 0}
.spark{display:block;width:100%;height:56px}
.foot{margin-top:34px;color:var(--ink2);font-size:.85rem;border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:no-preference){.board .big{transition:opacity .2s}}
</style></head>
<body><div id="app"><div class="wrap"><p style="padding:24px 0">Loading Mission Control…</p></div></div>

<script>/* Mission Control engine — pure functions over the baked data block.
   Runs unchanged in the browser and under Node (the test harness requires this same file).
   Classic and Draft are separate games: nothing in here ever adds a Classic number to a Draft number. */
(function (root, factory) { if (typeof module === "object" && module.exports) module.exports = factory(); else root.MCEngine = factory(); })(typeof self !== "undefined" ? self : this, function () {
"use strict";

/* ─────────────── small maths ─────────────── */
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function poisPmf(k, l) { if (l <= 0) return k === 0 ? 1 : 0; let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; }
function poisTail(t, l) { let c = 0; for (let k = 0; k < t; k++) c += poisPmf(k, l); return clamp(1 - c, 0, 1); }          // P(X >= t)
function expFloorDiv(l, d) { let e = 0; for (let k = d; k < 40; k++) e += Math.floor(k / d) * poisPmf(k, l); return e; }   // E[floor(X/d)]
function mulberry(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function rPois(l, rnd) { if (l <= 0) return 0; const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= rnd(); } while (p > L && k < 60); return k - 1; }
function rBinom(n, p, rnd) { let k = 0; for (let i = 0; i < n; i++) if (rnd() < p) k++; return k; }
function rNorm(rnd) { let u = 0, v = 0; while (u === 0) u = rnd(); while (v === 0) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function quantile(sorted, q) { if (!sorted.length) return 0; const i = clamp((sorted.length - 1) * q, 0, sorted.length - 1); const lo = Math.floor(i), hi = Math.ceil(i); return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo); }

const POS = { 1: "GKP", 2: "DEF", 3: "MID", 4: "FWD" };
const GOAL_PTS = { 1: 10, 2: 6, 3: 5, 4: 4 }, CS_PTS = { 1: 4, 2: 4, 3: 1, 4: 0 }, DC_T = { 1: 99, 2: 10, 3: 12, 4: 12 };
const FORMATIONS = []; for (let d = 3; d <= 5; d++) for (let m = 2; m <= 5; m++) for (let f = 1; f <= 3; f++) if (d + m + f === 10) FORMATIONS.push([d, m, f]);

function create(DATA, opts) {
  opts = opts || {};
  const CFG = { mu: 1.40, home: 1.09, away: 0.915, kShrink: 6, draftEnd: null, classicEnd: DATA.rules.chipStop || 19 };
  const next = DATA.gw.next, live = DATA.gw.live;
  const redraft = DATA.draft.league.redraft;
  CFG.draftEndApi = redraft ? redraft.fromGw - 1 : 38;
  CFG.draftEnd = opts.draftEnd || CFG.draftEndApi;

  /* ─────────────── lookups ─────────────── */
  const P = {}; DATA.players.forEach((p) => { P[p.id] = p; });
  const byKey = {}; DATA.players.forEach((p) => { byKey[p.n + "|" + p.t] = p; });
  const fxByTeamGw = {}; DATA.teams.forEach((t) => { fxByTeamGw[t.s] = {}; });
  DATA.fixtures.forEach((f) => { (fxByTeamGw[f.h][f.gw] = fxByTeamGw[f.h][f.gw] || []).push({ id: f.id, o: f.a, ha: "H", ko: f.ko, fin: f.fin }); (fxByTeamGw[f.a][f.gw] = fxByTeamGw[f.a][f.gw] || []).push({ id: f.id, o: f.h, ha: "A", ko: f.ko, fin: f.fin }); });
  const deadline = {}; DATA.gw.events.forEach((e) => { deadline[e.id] = e.dl; });
  function fx(team, gw) { return (fxByTeamGw[team] && fxByTeamGw[team][gw]) || []; }

  /* ─────────────── team ratings ───────────────
     Prior: what the game's own prices say about each side's attack and defence. Season: opponent-adjusted
     expected goals (70%) and goals (30%) from the matches played. The two are blended in log space, and the
     price exponents are fitted so the model reproduces the bookmaker-implied gameweek-5 numbers it was given. */
  const teamNames = DATA.teams.map((t) => t.s);
  const pricePrior = {}; teamNames.forEach((t) => {
    const sq = DATA.players.filter((p) => p.t === t && p.st !== "u");
    const att = sq.filter((p) => p.p >= 3).map((p) => p.pr).sort((a, b) => b - a).slice(0, 6), def = sq.filter((p) => p.p <= 2).map((p) => p.pr).sort((a, b) => b - a).slice(0, 6);
    const mean = (a) => a.reduce((s, x) => s + x, 0) / Math.max(1, a.length); pricePrior[t] = { a: mean(att), d: mean(def) };
  });
  const meanA = teamNames.reduce((s, t) => s + pricePrior[t].a, 0) / teamNames.length, meanD = teamNames.reduce((s, t) => s + pricePrior[t].d, 0) / teamNames.length;
  function buildRatings(ka, kd) {
    const R = {}; teamNames.forEach((t) => { R[t] = { att: Math.pow(pricePrior[t].a / meanA, ka), def: Math.pow(pricePrior[t].d / meanD, -kd) }; });
    for (let it = 0; it < 3; it++) {
      const S = {}; teamNames.forEach((t) => {
        const ts = DATA.teamSeason[t]; if (!ts || !ts.m) { S[t] = { att: R[t].att, def: R[t].def, w: 0 }; return; }
        let sa = 0, sd = 0; ts.log.forEach((m) => { const side = m.ha === "H" ? CFG.home : CFG.away, oside = m.ha === "H" ? CFG.away : CFG.home;
          const pf = 0.7 * m.xgf + 0.3 * m.gf, pa = 0.7 * m.xga + 0.3 * m.ga;
          sa += pf / (CFG.mu * side * R[m.o].def); sd += pa / (CFG.mu * oside * R[m.o].att); });
        S[t] = { att: clamp(sa / ts.m, 0.35, 2.6), def: clamp(sd / ts.m, 0.35, 2.6), w: ts.m / (ts.m + 8) };
      });
      const N = {}; teamNames.forEach((t) => { const pa = Math.pow(pricePrior[t].a / meanA, ka), pd = Math.pow(pricePrior[t].d / meanD, -kd), w = S[t].w;
        N[t] = { att: Math.exp((1 - w) * Math.log(pa) + w * Math.log(S[t].att)), def: Math.exp((1 - w) * Math.log(pd) + w * Math.log(S[t].def)) }; });
      const ga = Math.exp(teamNames.reduce((s, t) => s + Math.log(N[t].att), 0) / teamNames.length), gd = Math.exp(teamNames.reduce((s, t) => s + Math.log(N[t].def), 0) / teamNames.length);
      teamNames.forEach((t) => { R[t] = { att: N[t].att / ga, def: N[t].def / gd }; });
    }
    return R;
  }
  function rawLambda(R, team, opp, ha) { return CFG.mu * (ha === "H" ? CFG.home : CFG.away) * R[team].att * R[opp].def; }
  function matchOdds0(lh, la) { let h = 0, d = 0, a = 0; for (let i = 0; i < 10; i++) for (let j = 0; j < 10; j++) { const p = poisPmf(i, lh) * poisPmf(j, la); if (i > j) h += p; else if (i === j) d += p; else a += p; } const s = h + d + a; return { h: h / s, d: d / s, a: a / s }; }
  function devig(h, d, a) { const ih = 1 / h, id = 1 / d, ia = 1 / a, s = ih + id + ia; return { h: ih / s, d: id / s, a: ia / s, margin: s - 1 }; }
  function fitRates(t) { let best = null; for (let lh = 0.3; lh <= 3.61; lh += 0.05) for (let la = 0.3; la <= 3.61; la += 0.05) { const o = matchOdds0(lh, la), e = Math.pow(o.h - t.h, 2) + Math.pow(o.d - t.d, 2) + Math.pow(o.a - t.a, 2); if (!best || e < best.e) best = { lh, la, e }; }
    /* polish on a finer grid around the coarse answer */ const c = best; for (let lh = c.lh - 0.05; lh <= c.lh + 0.05; lh += 0.01) for (let la = c.la - 0.05; la <= c.la + 0.05; la += 0.01) { const o = matchOdds0(lh, la), e = Math.pow(o.h - t.h, 2) + Math.pow(o.d - t.d, 2) + Math.pow(o.a - t.a, 2); if (e < best.e) best = { lh, la, e }; } return best; }

    <section><span class="tag c">Classic</span><div class="panel c" style="margin-top:8px">${list("Repeat", cRepeat)}${list("Stop", cStop)}</div><div class="panel scroll" style="margin-top:10px"><table><thead><tr><th>GW</th><th class="n">You</th><th class="n">Average</th><th class="n">Overall rank</th><th>Captain</th><th>Better captain in squad</th><th class="n">Bench scored</th><th class="n">Avoidable</th><th>Top scorers</th></tr></thead><tbody>${cRows}</tbody></table></div></section>
    <section><span class="tag d">Draft</span><div class="panel d" style="margin-top:8px">${list("Repeat", dRepeat)}${list("Stop", dStop)}</div><div class="panel scroll" style="margin-top:10px"><table><thead><tr><th>GW</th><th>Result</th><th class="n">Score</th><th>Opponent</th><th class="n">Avoidable bench points</th><th>Best eleven would have changed it</th><th>Top scorers</th></tr></thead><tbody>${dRows}</tbody></table></div></section>`; }

  /* ════════════ LAB ════════════ */
  function vLab() { const t = R.tests || PRE.tests || null, cal = M.calib, fair = (DATA.intel.sources || []).map((s) => `<li>${esc(s)}</li>`).join("");
    return `<section><h2>How the numbers are made</h2><p class="lede">Plain account of the model, its checks and its limits.</p>
      <div class="panel"><ul class="plain"><li><b>Team strength.</b> Each side's attack and defence start from what the game's own prices imply, then move toward this season's opponent-adjusted expected goals (70%) and goals (30%). After ${G.lastDone} gameweeks the season carries about a third of the weight.</li>
      <li><b>Market check.</b> The price-to-strength scale is fitted so the model reproduces ${cal.n} bookmaker-implied numbers from gameweeks ${(cal.weeks || [5]).join(", ")}; match prices are turned into goals for each side by removing the margin and fitting the scoreline odds. Typical miss: ${cal.rmse != null ? (cal.rmse * 100).toFixed(0) + "%" : "–"} per number. Where a market number exists, it is used instead of the model.</li>
      <li><b>Players.</b> Expected goals and assists per 90 minutes this season, pulled toward a price-based prior worth six matches, scaled by the fixture. Clean sheets, goals conceded, saves, bonus, defensive contributions (10 actions for defenders, 12 for others, 2 points, once a match) and cards are all priced in.</li>
      <li><b>Minutes.</b> Recent starts count double. Official flags set availability; return dates switch players back on in the right gameweek. Where reporting runs ahead of an official flag, a dated override is used and shown next to the player.</li>
      <li><b>Optimisation.</b> The Classic plan is a mixed-integer programme over every gameweek to 19: squad, eleven, captain, transfers, hits, the free-transfer bank and the chip weeks are decided together, solved exactly to a stated tolerance. The Draft roster is solved the same way to the re-draft. The quick searches on the Classic and Draft tabs are greedy, run on your phone, and exist for what-if checks.</li>
      <li><b>Simulation.</b> Each run draws every scoreline, then deals goals and assists to players by their share, so team-mates rise and fall together. Substitutes come on automatically in bench order, as in the real game.</li></ul></div></section>
    <section><h3>Self-test</h3><div class="panel">${t ? `<p><b>${t.pass} of ${t.total}</b> checks pass${t.at ? ", run " + sast(t.at) + " SAST" : ""}.</p>${t.fails && t.fails.length ? `<ul class="plain">${t.fails.map((x) => `<li class="bad">${esc(x)}</li>`).join("")}</ul>` : ""}` : `<p class="muted">Not run in this session yet.</p>`}<div class="row"><button class="btn" data-act="run" data-v="tests" ${state.busy ? "disabled" : ""}>${state.busy === "tests" ? "Running…" : "Run the checks on this device"}</button></div>
      <p class="small muted">The checks cover the maths (probabilities sum to one, expected points never negative), the rules (every eleven legal, three a club, budget respected), the two games staying separate, and every tab rendering.</p></div></section>
    <section><h3>What it cannot see</h3><div class="panel"><ul class="plain"><li>This page cannot fetch live data by itself. Numbers refresh when the app is rebuilt from the feeds; ask for an update in chat.</li><li>Your saved Classic team for the next gameweek is private until the deadline passes. The app plans from your last published team, which is also your current fifteen unless you have made transfers since.</li><li>Rivals' Draft elevens publish only after each deadline. Before that the app assumes their best eleven.</li><li>Four gameweeks is a small sample. Early-season projections lean on prices and will sharpen each week.</li><li>Bookmaker prices are loaded for gameweek 6 and three gameweek 7 matches. Beyond that the team ratings carry the fixtures; add prices on the Odds tab as they appear.</li></ul></div></section>
    <section><h3>Sources</h3><div class="panel"><ul class="plain"><li>Official Fantasy Premier League and FPL Draft public feeds, pulled ${sast(DATA.asOf)} SAST</li>${fair}</ul></div></section>`; }

  function selfTest() { const fails = []; let total = 0; const ok = (c, m) => { total++; if (!c) fails.push(m); };
    const o = M.matchOdds(1.6, 1.1); ok(Math.abs(o.h + o.d + o.a - 1) < 1e-9, "match odds sum to one"); ok(M.maths.poisTail(0, 2) === 1, "Poisson tail at zero");
    DATA.players.slice(0, 200).forEach((p) => { const e = M.ep(p, next); ok(isFinite(e) && e > -1.5 && e < 20, "expected points in range for " + p.n); });
    if (classicState) { const b = M.bestXI(classicState.squad, next); ok(b && b.xi.length === 11, "Classic eleven has 11"); ok(b && b.xi.filter((p) => p.p === 1).length === 1, "one goalkeeper"); const c = {}; classicState.squad.forEach((p) => { c[p.t] = (c[p.t] || 0) + 1; }); ok(Object.values(c).every((n) => n <= 3), "three a club in your squad"); }
    const b2 = M.bestXI(myRoster, next); ok(b2 && b2.xi.length === 11, "Draft eleven has 11"); ok(myRoster.length === 15, "Draft roster has 15"); ok(M.freeAgents().every((p) => !p.do), "free agents are unowned");
    TABS.forEach((t) => { try { const h = view(t[0]); ok(typeof h === "string" && h.length > 200, "tab renders: " + t[1]); } catch (e) { ok(false, "tab crashed: " + t[1] + " (" + e.message + ")"); } });
    return { pass: total - fails.length, total, fails, at: new Date().toISOString() }; }

  /* ── frame ── */
  function view(tab) { return ({ today: vToday, classic: vClassic, draft: vDraft, leagues: vLeagues, fixtures: vFixtures, players: vPlayers, odds: vOdds, review: vReview, lab: vLab }[tab] || vToday)(); }
  function render() { return `<div class="wrap ${state.explain ? "explain" : ""}"><header class="mast"><div><h1>Mission Control</h1><div class="muted small">Fantasy Premier League, two games kept apart. ${VERSION}</div></div><div class="stamp"><button class="helpbtn" data-act="explain" aria-pressed="${state.explain}">${state.explain ? "Hide explanations" : "Explain everything"}</button><br>data ${sast(DATA.asOf)} SAST</div></header>
    <nav class="tabs" role="tablist" aria-label="Sections">${TABS.map((t) => `<button class="tab ${t[2]}" role="tab" aria-selected="${state.tab === t[0]}" data-act="tab" data-v="${t[0]}">${t[1]}</button>`).join("")}</nav><main>${view(state.tab)}</main>
    <footer class="foot">Expected points are averages, not promises. Classic and Draft are separate games and are never added together here.</footer></div>`; }

  const HEAVY = { tr: () => { const r = M.classicTransfers(classicState, next, cEnd, Math.min(classicState.ft, 5)); R.tr = { moves: r.moves.map((m) => ({ out: m.out.id, inn: m.inn.id, gain: m.gain, gainNext: m.gainNext, bankAfter: m.bankAfter })), value: r.value }; },
    wc: () => { const budget = classicState.squad.reduce((s, p) => s + p.sell, 0) + classicState.bank, w = M.wildcard(budget, next, cEnd, { perPos: 26 }); if (w) R.wc = { squad: w.squad.map((p) => p.id), cost: w.cost, budget: w.budget, value: w.value }; if (!transfers()) HEAVY.tr(); },
    trade: () => { R.trades = findTrades(); }, tests: () => { R.tests = selfTest(); } };
  function act(name, el, rerender, later) { const v = el && el.getAttribute ? el.getAttribute("data-v") : null; let top = false;
    if (name === "tab") { state.tab = v; top = true; } else if (name === "explain") state.explain = !state.explain; else if (name === "xi") state.xiMode = v; else if (name === "fapos") state.faPos = +v; else if (name === "fpos") { state.fpos = +v; state.fmax = 40; } else if (name === "ffree") { state.ffree = !state.ffree; state.fmax = 40; }
    else if (name === "fsort") state.fsort = v; else if (name === "more") state.fmax += 40; else if (name === "tmode") state.tickMode = v; else if (name === "tspan") state.tickSpan = +v; else if (name === "calc") { /* values already in state */ }
    else if (name === "dend") { state.draftEnd = +v; M.setDraftEnd(state.draftEnd); ["mv", "duel", "race", "trades"].forEach((k) => { delete R[k]; }); }
    else if (name === "applyodds") { const fxs = DATA.fixtures, sel = fxs.find((f) => String(f.id) === String(state.oddsFx)) || fxs.find((f) => f.gw === next), h = parseFloat(state.oH), d = parseFloat(state.oD), a = parseFloat(state.oA); if (sel && h > 1 && d > 1 && a > 1) { const fit = fitRates(devig(h, d, a)); state.market = state.market || {}; state.market[sel.gw] = Object.assign({}, state.market[sel.gw] || {}); state.market[sel.gw][sel.h] = { xg: fit.lh }; state.market[sel.gw][sel.a] = { xg: fit.la }; M.setMarket(state.market); Object.keys(R).forEach((k) => { if (k !== "tests") delete R[k]; }); } }
    else if (name === "rmodds") { const g = el.getAttribute("data-g"), t = el.getAttribute("data-t"); if (state.market[g]) { delete state.market[g][t]; if (!Object.keys(state.market[g]).length) delete state.market[g]; } M.setMarket(state.market); Object.keys(R).forEach((k) => { if (k !== "tests") delete R[k]; }); }
    else if (name === "run" && HEAVY[v]) { state.busy = v; rerender(false); (later || ((fn) => fn()))(() => { try { HEAVY[v](); } catch (e) { R.err = e.message; } state.busy = null; rerender(false); if (store) store.save(persisted()); }); return; }
    if (store) store.save(persisted()); rerender(top); }
  function input(key, value) { if (["q", "oH", "oD", "oA", "oddsFx"].includes(key)) { state[key] = value; if (key === "q") state.fmax = 40; if (store) store.save(persisted()); } }
  const persisted = () => ({ tab: state.tab, explain: state.explain, draftEnd: state.draftEnd, market: state.market, tickMode: state.tickMode, tickSpan: state.tickSpan });
  return { state, render, view, act, input, selfTest, findTrades, buildClaimSheet, TABS, VERSION, helpers: { sast, countdown, devig, fitRates } };
}

function boot(M, DATA, PRE) {
  const KEY = "mission-control-v1"; const store = { load: () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } }, save: (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* storage can be unavailable; the app works without it */ } } };

    rootEl.innerHTML = ui.render(); if (toTop) { window.scrollTo(0, 0); const tabs = rootEl.querySelector(".tab[aria-selected='true']"); if (tabs && tabs.scrollIntoView) tabs.scrollIntoView({ block: "nearest", inline: "center" }); }
    if (id) { const el = rootEl.querySelector('[data-input="' + id + '"]'); if (el) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) { /* number inputs have no selection */ } } } tick(); }
  function tick() { rootEl.querySelectorAll("[data-countdown]").forEach((el) => { const t = new Date(el.getAttribute("data-countdown")).getTime(); if (t) el.textContent = ui.helpers.countdown(t - Date.now()); }); }
  document.addEventListener("click", (e) => { const el = e.target.closest ? e.target.closest("[data-act]") : null; if (!el || el.disabled) return; ui.act(el.getAttribute("data-act"), el, paint, (fn) => setTimeout(fn, 30)); });
  document.addEventListener("input", (e) => { const el = e.target; const k = el.getAttribute && el.getAttribute("data-input"); if (!k) return; ui.input(k, el.value); if (k === "q") paint(false); });
  document.addEventListener("change", (e) => { const el = e.target; const k = el.getAttribute && el.getAttribute("data-input"); if (k === "oddsFx") { ui.input(k, el.value); paint(false); } });
  paint(true); setInterval(tick, 30000); return ui;
}
return { makeUI, boot, VERSION };
});
