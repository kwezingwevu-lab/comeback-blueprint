<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Comeback Blueprint — Pure Muscle · FFMI 25</title>
<meta name="theme-color" content="#0A0D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comeback">
<meta name="description" content="Pure-muscle training, fuel and progress app: six-day push/pull/legs with a Legs &amp; Back focus, auto-progression, an FFMI-25 engine, logging and a two-year roadmap.">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230A0D14'/%3E%3Cpath d='M40 138L70 70l22 36 22-50 36 82' fill='none' stroke='%23FFC53D' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --ink:#0A0D14;--ink-2:#0E121B;--panel:#141925;--panel-2:#1A2030;--panel-3:#222A3D;
  --line:#2A3346;--line-2:#374257;--text:#F3F6FC;--text-2:#9FAAC0;--text-3:#7D89A5;
  --gold:#FFC53D;--gold-2:#FFD970;--gold-deep:#E0A012;          /* STRENGTH pillar */
  --cyan:#3FD8C8;--cyan-2:#6FE9DC;--cyan-deep:#23A99B;          /* ENDURANCE pillar */
  --go:#42D77D;--warn:#F0883E;--danger:#F65B5B;--bad:#FF6B7A;--violet:#9D8CFF;
  --f-display:'Space Grotesk',-apple-system,system-ui,sans-serif;
  --f-body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r-sm:9px;--r:13px;--r-lg:18px;--r-xl:24px;
  --sh:0 6px 24px rgba(0,0,0,.4);--sh-lg:0 16px 50px rgba(0,0,0,.55);
  --glow-gold:0 0 0 1px rgba(255,197,61,.3),0 10px 30px rgba(255,197,61,.22);
  --glow-cyan:0 0 0 1px rgba(63,216,200,.3),0 10px 30px rgba(63,216,200,.2);
  --maxw:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:"tnum" 0}
.chart-svg text{font-variant-numeric:tabular-nums}
body{font-family:var(--f-body);background:var(--ink);color:var(--text);line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased;padding-bottom:96px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(680px 380px at 82% -10%,rgba(255,197,61,.09),transparent 60%),radial-gradient(620px 380px at 8% -5%,rgba(63,216,200,.08),transparent 58%)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px;position:relative;z-index:1}

header.app{position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(180deg,rgba(10,13,20,.97),rgba(10,13,20,.85));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.head-inner{max-width:var(--maxw);margin:0 auto;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:42px;height:42px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--gold-2) 0%,var(--gold-deep) 48%,var(--cyan-deep) 100%);box-shadow:0 6px 18px rgba(255,197,61,.28),inset 0 1px 0 rgba(255,255,255,.4);display:grid;place-items:center}
.mark svg{width:24px;height:24px}
.brand-txt h1{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.05}
.brand-txt span{font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-3);font-weight:700}
.cd{display:flex;gap:7px;flex:none}
.cd-box{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 8px;text-align:center;min-width:50px}
.cd-box b{font-family:var(--f-mono);font-size:16px;font-weight:600;color:var(--cyan);display:block;line-height:1.1}
.cd-box small{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);font-weight:700}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:60;background:linear-gradient(0deg,var(--ink-2),rgba(14,18,27,.95));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:flex-start;gap:2px;padding:8px 2px calc(8px + env(safe-area-inset-bottom));overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .tab{flex:1 0 12.5%}
.tab{flex:1;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px;border-radius:10px;color:var(--text-3);font-family:var(--f-body);transition:color .15s}
.tab svg{width:21px;height:21px;stroke-width:2;fill:none;stroke:currentColor}
.tab span{font-size:9.5px;font-weight:700;letter-spacing:.2px}
.tab.active{color:var(--gold)}
.tab.active.run{color:var(--cyan)}
.tab.active svg{filter:drop-shadow(0 0 6px rgba(255,197,61,.5))}
.tab.active.run svg{filter:drop-shadow(0 0 6px rgba(63,216,200,.5))}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.view{display:none;padding:22px 0 40px;animation:fade .3s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:7px}
.eyebrow.cyan{color:var(--cyan)}
.view-title{font-family:var(--f-display);font-size:33px;font-weight:700;letter-spacing:-.8px;line-height:1;margin-bottom:6px}
.view-sub{color:var(--text-2);font-size:14.5px;margin-bottom:22px;max-width:64ch}

/* dual hero */
.hero{position:relative;background:linear-gradient(155deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r-xl);padding:24px;margin-bottom:16px;overflow:hidden;box-shadow:var(--sh)}
.hero::after{content:"";position:absolute;top:-70px;right:-50px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(63,216,200,.13),transparent 65%);pointer-events:none}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;flex-wrap:wrap}
.hero-race{min-width:0}
.hero-race .hr-l{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-bottom:6px}
.hero-race .hr-d{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.5px}
.hero-race .hr-s{font-size:12.5px;color:var(--text-2);margin-top:6px;font-family:var(--f-mono)}
.cd-ring{flex:none;position:relative;width:104px;height:104px}
.cd-ring svg{transform:rotate(-90deg)}
.cd-lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd-lab b{font-family:var(--f-mono);font-size:26px;font-weight:700;line-height:1;color:var(--cyan)}
.cd-lab small{font-size:10px;line-height:1.25;letter-spacing:1px;text-align:center;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-top:3px}

.pillars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.pillar{border-radius:var(--r-lg);padding:16px;border:1px solid var(--line);position:relative;overflow:hidden}
.pillar.str{background:linear-gradient(155deg,rgba(255,197,61,.08),var(--panel))}
.pillar.end{background:linear-gradient(155deg,rgba(63,216,200,.08),var(--panel))}
.pillar .pi{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pillar .pi svg{width:18px;height:18px}
.pillar.str .pi svg{color:var(--gold)}.pillar.end .pi svg{color:var(--cyan)}
.pillar .pi span{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
.pillar.str .pi span{color:var(--gold)}.pillar.end .pi span{color:var(--cyan)}
.pillar .pv{font-family:var(--f-mono);font-size:24px;font-weight:600;line-height:1}
.pillar .pl{font-size:11.5px;color:var(--text-2);margin-top:5px}
.pillar .pmeta{font-family:var(--f-mono);font-size:11px;color:var(--text-3);margin-top:8px}

/* today card */
.today{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px}
.today-band{padding:14px 18px;display:flex;align-items:center;gap:12px}
.today-band.lift{background:linear-gradient(90deg,rgba(255,197,61,.14),transparent)}
.today-band.run{background:linear-gradient(90deg,rgba(63,216,200,.14),transparent)}
.today-band.rest{background:linear-gradient(90deg,rgba(157,140,255,.12),transparent)}
.tb-ic{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center}
.today-band.lift .tb-ic{background:rgba(255,197,61,.15);color:var(--gold)}
.today-band.run .tb-ic{background:rgba(63,216,200,.15);color:var(--cyan)}
.today-band.rest .tb-ic{background:rgba(157,140,255,.15);color:var(--violet)}
.tb-ic svg{width:22px;height:22px}
.tb-txt .tb-day{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);font-weight:700}
.tb-txt .tb-title{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.2px}
.today-body{padding:16px 18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--text-2);line-height:1.6}
.today-body b{color:var(--text)}

/* week strip */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.wd{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 4px;text-align:center}
.wd.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.wd .wdn{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-bottom:5px}
.wd .wdi{width:24px;height:24px;border-radius:7px;margin:0 auto;display:grid;place-items:center}
.wd .wdi svg{width:14px;height:14px}
.wd .wdi.lift{background:rgba(255,197,61,.15);color:var(--gold)}
.wd .wdi.run{background:rgba(63,216,200,.15);color:var(--cyan)}
.wd .wdi.rest{background:rgba(110,120,148,.12);color:var(--text-3)}
.wd .wdl{font-size:10px;color:var(--text-2);margin-top:4px;font-weight:600;line-height:1.2}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:16px}
.card-t{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:4px;display:flex;align-items:center;gap:9px;text-wrap:balance}
.card-t .ic{color:var(--gold);display:inline-flex}
.card-t.cyan .ic{color:var(--cyan)}
.card-st{font-size:13px;color:var(--text-3);margin-bottom:16px}
.prose{font-size:14px;color:var(--text-2);line-height:1.68}
.prose p{margin-bottom:11px}.prose b{color:var(--text);font-weight:700}
.prose .hl{color:var(--gold);font-weight:700}.prose .hlc{color:var(--cyan);font-weight:700}

.note{padding:13px 15px;border-radius:var(--r);font-size:13px;line-height:1.6;margin-bottom:12px}
.note.gold{background:rgba(255,197,61,.08);border:1px solid rgba(255,197,61,.25);color:#f0d79a}
.note.cyan{background:rgba(63,216,200,.08);border:1px solid rgba(63,216,200,.22);color:#a6ece4}
.note.red{background:rgba(246,91,91,.08);border:1px solid rgba(246,91,91,.25);color:#f4b0b0}
.note b{color:var(--text)}

/* segmented */
.seg{display:flex;gap:6px;background:var(--panel-3);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px}
.seg button{flex:1;background:none;border:0;color:var(--text-2);font-family:var(--f-body);font-size:12.5px;font-weight:700;padding:9px 6px;border-radius:8px;cursor:pointer;transition:.15s;min-height:40px}
.seg button.on{background:linear-gradient(145deg,var(--gold-2),var(--gold-deep));color:#1a1407}
#bulkSeg{flex-wrap:wrap}#bulkSeg button{flex:1 1 30%;min-width:0}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.seg.cyan button.on{background:linear-gradient(145deg,var(--cyan),var(--cyan-deep));color:#04201d}

/* day pills */
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--text-2);font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.3px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
.pill.on{background:linear-gradient(145deg,var(--gold-2),var(--gold-deep));color:#1a1407;border-color:transparent}
.pill.on.cyan{background:linear-gradient(145deg,var(--cyan),var(--cyan-deep));color:#04201d}
.pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* exercise card (lift) */
.ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:13px;overflow:hidden}
.ex-h{display:flex;gap:12px;padding:14px 16px 11px;align-items:flex-start}
.ex-n{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;background:var(--panel-3);color:var(--gold);border:1px solid var(--line-2)}
.ex-ti{flex:1;min-width:0}
.ex-nm{font-size:15.5px;font-weight:700;line-height:1.25}
.ex-tag{font-size:11.5px;margin-top:2px}
.ex-tag.cmp{color:var(--go)}.ex-tag.iso{color:var(--text-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.chip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;background:var(--panel-3);color:var(--text-2);border:1px solid var(--line)}
.chip b{color:var(--text);font-family:var(--f-mono);font-weight:600}
.chip.stretch{background:rgba(157,140,255,.12);border-color:rgba(157,140,255,.3);color:#c5b8ff}
.chip.rir{background:rgba(246,91,91,.1);border-color:rgba(246,91,91,.25);color:#ffb3b3}
.chip.rir b{color:#ff8a8a}
.lastt{margin:0 16px 12px;padding:8px 11px;border-radius:var(--r-sm);background:rgba(255,197,61,.07);border:1px solid rgba(255,197,61,.18);font-size:12px;color:var(--text-2)}
.lastt b{color:var(--gold);font-family:var(--f-mono)}
.hw-tog{display:flex;align-items:center;gap:6px;margin:-4px 16px 6px;cursor:pointer;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--text-2);background:none;border:0;padding:8px 0;min-height:36px}
.hw-tog svg{width:14px;height:14px;transition:transform .2s}
.hw-tog.open svg{transform:rotate(90deg)}
.hw-b{display:none;margin:0 16px 14px;padding:13px 14px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r)}
.hw-b.open{display:block}
.hw-b .blk{margin-bottom:10px}.hw-b .blk:last-child{margin-bottom:0}
.hw-b .lbl,.supp-b .lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.hw-b .lbl.how,.supp-b .lbl.how{color:var(--gold)}.hw-b .lbl.why,.supp-b .lbl.why{color:var(--go)}
.hw-b p{font-size:12.5px;color:var(--text-2);line-height:1.6}
/* sets table */
.sets{padding:0 12px 14px}
.set-grid{width:100%;border-collapse:collapse}
.set-grid th{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-2);font-weight:700;padding:4px 5px;text-align:center}
.set-row td{padding:4px 4px}
.set-no{font-family:var(--f-display);font-size:15px;color:var(--text-3);text-align:center;width:30px}
.set-row.done .set-no{color:var(--go)}
.cell{width:100%;background:var(--panel-3);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:var(--f-mono);font-size:16px;font-weight:600;text-align:center;padding:9px 3px;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.cell:focus{outline:none;border-color:var(--gold);background:var(--ink-2);box-shadow:0 0 0 3px rgba(255,197,61,.14)}
.cell.filled{border-color:var(--line-2)}
.e1{font-family:var(--f-mono);font-size:10.5px;color:var(--text-2);text-align:center;white-space:nowrap}
.chk{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--panel-3);cursor:pointer;display:grid;place-items:center;color:transparent;margin:0 auto;position:relative}
.chk::after{content:"";position:absolute;inset:-7px}
.chk svg{width:15px;height:15px;stroke-width:3}
.chk.on{background:linear-gradient(145deg,var(--go),#1fa85f);border-color:transparent;color:#06231a}
.set-act{display:flex;gap:8px;padding:8px 4px 0}
.mini{flex:1;background:var(--panel-3);border:1px solid var(--line);color:var(--text-2);border-radius:8px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--f-body);min-height:38px}
.mini svg{width:14px;height:14px}
@media(hover:hover){.mini:hover{border-color:var(--line-2);color:var(--text)}}

/* run week card */
.rweek{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
.rweek.cur{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.rweek-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;cursor:pointer;background:linear-gradient(155deg,var(--panel-2),var(--panel))}
@media(hover:hover){.rweek-h:hover{background:var(--panel-2)}}
.rwh-l{display:flex;align-items:center;gap:13px;min-width:0;flex:1 1 auto}
.rwh-num{font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--cyan);flex:none}
.rwh-meta h4{font-size:14.5px;font-weight:700}
.rwh-meta p{font-size:11.5px;color:var(--text-3);margin-top:1px}
.rwh-r{font-family:var(--f-mono);font-size:12px;color:var(--text-2);flex:none;text-align:right;min-width:74px}
.rwh-chev{color:var(--text-3);transition:transform .25s;flex:none}
.rweek.open .rwh-chev{transform:rotate(90deg)}
.rweek-b{display:none;padding:4px 16px 14px}
.rweek.open .rweek-b{display:block}
.racecallout{margin-top:12px;border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:10px;padding:11px 13px;background:rgba(63,216,200,.05)}
.racecallout.key{border-left-color:var(--gold);background:rgba(255,197,61,.07)}
.racecallout.goal{border-left-color:var(--go);background:rgba(66,215,125,.09)}
.racecallout.taper{border-left-color:var(--warn);background:rgba(240,136,62,.06)}
.racecallout.pr{border-left-color:var(--violet,#9B8CFF)}
.rc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.rc-badge{font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--cyan)}
.racecallout.key .rc-badge{color:var(--gold)}.racecallout.goal .rc-badge{color:var(--go)}.racecallout.taper .rc-badge{color:var(--warn)}
.rc-when{font-family:var(--f-mono);font-size:11px;color:var(--text-3);font-weight:700;flex:none}
.rc-name{font-size:14.5px;font-weight:700;margin-bottom:2px}
.rc-meta{font-size:12px;color:var(--text-2);margin-bottom:6px}
.rc-advice{font-size:12px;color:var(--text-2);line-height:1.55}
.rc-alt{font-size:11.5px;color:var(--text-3);margin-top:5px;font-style:italic}
.runrow{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.runrow:first-child{border-top:0}
.rr-day{flex:none;width:64px;font-family:var(--f-mono);font-size:10.5px;color:var(--text-3);font-weight:600;padding-top:2px;line-height:1.3}
.rr-tag{flex:none;width:8px;border-radius:4px;align-self:stretch}
.rr-tag.easy{background:var(--go)}.rr-tag.quality{background:var(--warn)}.rr-tag.long{background:var(--cyan)}.rr-tag.lift{background:var(--gold)}.rr-tag.rest{background:var(--line-2)}.rr-tag.race{background:var(--danger)}
.rr-body{flex:1;min-width:0}
.rr-t{font-size:13.5px;font-weight:700}
.rr-d{font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.45}

/* calculators */
.input-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-bottom:16px}
.field label{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;background:var(--panel-3);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--f-mono);font-size:16px;font-weight:500;padding:11px 12px}
.field select,select.sel{width:100%;background:var(--panel-3) url("data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%239FAAC0%27 stroke-width=%272.5%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27><path d=%27M6 9l6 6 6-6%27/></svg>") no-repeat right 11px center/14px;border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--f-body);font-size:16px;font-weight:600;padding:9px 34px 9px 12px;min-height:40px;-webkit-appearance:none;appearance:none}
select option{background:var(--panel-2);color:var(--text)}
.field input:focus,.field select:focus,select.sel:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,197,61,.14)}
.field.full{grid-column:1/-1}
.readout{background:linear-gradient(155deg,var(--panel-2),var(--ink-2));border:1px solid var(--line-2);border-radius:var(--r);padding:18px;margin-top:4px}
.macro-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.macro{text-align:center;padding:12px 4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm)}
.macro .mv{font-family:var(--f-mono);font-size:21px;font-weight:600;line-height:1}
.macro .mv.cal{color:var(--gold)}.macro .mv.pro{color:var(--cyan)}.macro .mv.carb{color:var(--go)}.macro .mv.fat{color:var(--warn)}
.macro .ml{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-top:6px}
.macro .mg{font-size:10.5px;color:var(--text-2);font-family:var(--f-mono);margin-top:2px;white-space:normal}
.calc-note{font-size:12.5px;color:var(--text-2);line-height:1.6;padding-top:4px}
.calc-note b{color:var(--text)}
.pace-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pace{padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;gap:8px}
.pace .pn{font-size:12.5px;font-weight:700}
.pace .pn small{display:block;font-size:10.5px;color:var(--text-3);font-weight:500;margin-top:1px}
.pace .pp{font-family:var(--f-mono);font-size:16px;font-weight:600;color:var(--cyan);white-space:nowrap}
.pace.race .pp{color:var(--gold)}

/* gauge */
.gauge-svg{width:100%;height:auto;display:block;overflow:visible}
.gauge-legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:13px;justify-content:center}
.gl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);font-weight:600}
.gl .dot{width:10px;height:10px;border-radius:3px}
.gl .ln{width:16px;height:0;border-top:2px dashed;flex:none}
.rm-legend{gap:8px 14px;margin-top:10px}
.rm-legend .gl{font-size:11px}
.verdict{margin-top:15px;padding:14px 16px;border-radius:var(--r);font-size:13px;line-height:1.6}
.verdict.ok{background:rgba(66,215,125,.09);border:1px solid rgba(66,215,125,.25);color:#a8e9c2}
.verdict.warn{background:rgba(246,91,91,.08);border:1px solid rgba(246,91,91,.25);color:#f4b0b0}
.verdict b{color:var(--text)}

/* tracking */
.track-tabs{display:flex;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.track-tabs::-webkit-scrollbar{display:none}
.track-tabs button{flex:1 1 0;min-width:0;background:none;border:0;color:var(--text-2);font-family:var(--f-body);font-size:12px;font-weight:700;padding:9px 6px;border-radius:8px;cursor:pointer;white-space:nowrap;min-height:40px}
.track-tabs button.on{background:var(--panel-3);color:var(--gold)}
.track-pane{display:none}.track-pane.on{display:block}
.quick{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.quick .field{flex:1;min-width:104px;margin:0}
.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:16px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.chart-head h3{font-size:14px;font-weight:700}
.chart-head .chs{font-size:11.5px;color:var(--text-3);font-family:var(--f-mono)}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
/* progress photos */
.ph-add{display:flex;gap:8px;margin:12px 0 6px}
.ph-add .mini{flex:1}
.ph-add .mini svg{width:15px;height:15px;flex:none}
.ph-note{font-size:11.5px;line-height:1.45;color:var(--text-3);margin:0 0 12px}
.ph-seg{margin-bottom:10px}
.seg button:disabled{opacity:.35;cursor:default}
.ph-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-cmp figure{margin:0;background:var(--panel-3);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ph-cmp img{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--ink)}
.ph-cmp figcaption{display:flex;justify-content:space-between;gap:6px;padding:7px 9px;font-family:var(--f-mono);font-size:11px;color:var(--text-2)}
.ph-wait{display:flex;align-items:center;padding:12px;border:1px dashed var(--line-2);border-radius:10px;font-size:12px;line-height:1.45;color:var(--text-3)}
.ph-list{margin-top:12px}
.ph-th{width:36px;height:48px;border-radius:6px;overflow:hidden;flex:none;background:var(--panel-3);border:1px solid var(--line)}
.ph-th img{width:100%;height:100%;object-fit:cover;display:block}
.ph-foot{display:flex;flex-direction:column;gap:10px;margin-top:6px;font-size:11.5px;line-height:1.45;color:var(--text-3)}
.chart-read{font-family:var(--f-mono);font-size:12px;line-height:18px;min-height:18px;color:var(--text-2);margin:6px 0 2px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-read b{color:var(--text);font-weight:600}
.chart-read .sep{color:var(--text-3)}
.chart-read .hint{font-family:var(--f-body);font-size:11px;color:var(--text-3)}
svg[data-tip]{touch-action:pan-y;cursor:crosshair;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
svg[data-tip]:focus{outline:none}
svg[data-tip]:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:6px}
.log-list{margin-top:4px}
.log-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.log-row .ld{font-family:var(--f-mono);font-size:11.5px;color:var(--text-3);flex:none;width:62px}
.log-row .lv{font-family:var(--f-mono);font-size:16px;font-weight:600;color:var(--gold)}
.log-row .lv.cyan{color:var(--cyan)}
.log-row .lx{flex:1;font-size:12px;color:var(--text-2);font-family:var(--f-mono)}
.log-row .del{background:none;border:0;color:var(--text-3);cursor:pointer;padding:10px;margin:-6px;min-width:40px;min-height:40px;display:inline-grid;place-items:center}
@media(hover:hover){.log-row .del:hover{color:var(--danger)}}
.empty{text-align:center;padding:32px 20px;color:var(--text-3)}
.empty svg{width:38px;height:38px;margin-bottom:12px;opacity:.5}
.empty p{font-size:13.5px;max-width:36ch;margin:0 auto;line-height:1.6}

.btn{border:0;border-radius:var(--r);cursor:pointer;font-family:var(--f-body);font-weight:700;font-size:15px;padding:14px 20px;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.16s;width:100%;min-height:40px}
.lastt .btn{min-height:36px}
.btn svg{width:18px;height:18px}
.btn-gold{background:linear-gradient(145deg,var(--gold-2),var(--gold-deep));color:#1a1407;box-shadow:var(--glow-gold)}
.btn-cyan{background:linear-gradient(145deg,var(--cyan-2),var(--cyan-deep));color:#04201d;box-shadow:var(--glow-cyan)}
.btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--text)}
@media(hover:hover){.btn-ghost:hover{border-color:var(--line-2)}}
@media(hover:hover){.btn:hover{transform:translateY(-1px)}}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.landmark-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.lm{text-align:center;padding:12px 4px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm)}
.lm .lmv{font-family:var(--f-mono);font-size:16px;font-weight:600;color:var(--gold)}
.lm .lml{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-top:4px}
.lm .lmd{font-size:10.5px;color:var(--text-2);margin-top:2px}

.refs{font-size:11.5px;color:var(--text-3);line-height:1.7}
.refs .r{padding:7px 0;border-top:1px solid var(--line)}
.refs .r:first-child{border-top:0}
.refs b{color:var(--text-2)}
.disclaimer{background:rgba(240,136,62,.07);border:1px solid rgba(240,136,62,.22);border-radius:var(--r);padding:13px 15px;font-size:12.5px;color:#f3c393;line-height:1.6;margin-top:14px}
.disclaimer b{color:var(--warn)}

#toast{position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--line-2);border-radius:18px;padding:11px 20px;font-size:13.5px;font-weight:600;color:var(--text);z-index:200;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:.3s;white-space:normal;text-align:left;display:flex;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
#toast span{min-width:0}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast svg{width:16px;height:16px;flex:none;color:var(--go)}
#toast.cyan svg{color:var(--cyan)}
#toast.act{pointer-events:auto}
#toast .undo{background:none;border:0;border-left:1px solid var(--line-2);margin-left:6px;padding:6px 2px 6px 14px;color:var(--gold);font:inherit;font-weight:800;cursor:pointer;min-height:36px}
.storage-warn{display:none;background:rgba(240,136,62,.1);border:1px solid rgba(240,136,62,.3);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:13px;color:#f3c393}
.storage-warn.show{display:block}
.storage-warn div+div{margin-top:6px}
.storage-warn .warn-act{display:flex;gap:8px;margin-top:10px}
.storage-warn .warn-act button{flex:none;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid rgba(240,136,62,.5);background:rgba(240,136,62,.14);color:#f8d2ac;font:inherit;font-weight:700;cursor:pointer}
.foot-note{text-align:center;color:var(--text-3);font-size:11.5px;padding:22px 0 8px;line-height:1.6}

@media(min-width:760px){
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:6px;padding:8px 16px;background:linear-gradient(180deg,rgba(10,13,20,.97),rgba(10,13,20,.85))}
  .tab{flex:none;flex-direction:row;padding:9px 15px;border-radius:999px;gap:8px}
  .tab span{font-size:13px}
  .tab.active{background:var(--panel)}
  header.app{position:static}
  .input-grid{grid-template-columns:repeat(3,1fr)}
  .view-title{font-size:42px}
  .pace-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:380px){
  .pillars{grid-template-columns:1fr}
  .cd{display:none}
}
/* ---- 7-tab nav fit ---- */

@media(min-width:760px){nav.tabs .tab span{font-size:13px}nav.tabs .tab svg{width:20px;height:20px}}
/* ---- start banner / completion ---- */
.startban{background:linear-gradient(135deg,rgba(63,216,200,.14),rgba(255,197,61,.10));border:1px solid var(--cyan-deep);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.startban .sb-d{flex:none;width:54px;height:54px;border-radius:14px;background:var(--ink-2);border:1px solid var(--cyan-deep);display:flex;flex-direction:column;align-items:center;justify-content:center}
.startban .sb-d b{font-family:var(--f-mono);font-size:20px;color:var(--cyan);line-height:1}
.startban .sb-d small{font-size:8px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-top:2px}
.startban .sb-t h4{font-size:15px;font-weight:800}
.startban .sb-t p{font-size:12.5px;color:var(--text-2);margin-top:2px}
.compbar{display:flex;gap:10px;margin-bottom:16px}
.compcard{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.compcard .cc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.compcard .cc-l{font-size:11px;letter-spacing:.5px;text-transform:uppercase;font-weight:700}
.compcard.lift .cc-l{color:var(--gold)}.compcard.run .cc-l{color:var(--cyan)}
.compcard .cc-v{font-family:var(--f-mono);font-size:13px;color:var(--text-2)}
.dots{display:flex;gap:5px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--panel-3);border:1px solid var(--line)}
.compcard.lift .dots i.on{background:var(--gold);border-color:transparent}
.compcard.run .dots i.on{background:var(--cyan);border-color:transparent}
/* ---- roadmap ---- */
.rm-mile{display:block;font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:8px;margin-top:2px;line-height:1.4}
.rm-mile.race{background:rgba(246,91,91,.13);color:#ffb3b3;border:1px solid rgba(246,91,91,.3)}
.rm-mile.phase{background:rgba(255,197,61,.12);color:#f0d79a;border:1px solid rgba(255,197,61,.3)}
.rm-mile.retest{background:rgba(255,197,61,.12);color:#f0d79a;border:1px solid rgba(255,197,61,.3)}
.rm-mile.health{background:rgba(157,140,255,.13);color:#c5b8ff;border:1px solid rgba(157,140,255,.3)}
.rm-tag{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;margin:3px 4px 0 0}
.rm-tag.deload{background:rgba(63,216,200,.1);color:#a6ece4;border:1px solid rgba(63,216,200,.25)}
.rm-tag.photo{background:var(--panel-3);color:var(--text-2);border:1px solid var(--line)}
.rm-week{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.rm-week.now{background:rgba(255,197,61,.05);margin:0 -16px;padding:9px 16px;border-radius:8px}
.rm-wn{flex:none;width:46px}
.rm-wn b{font-family:var(--f-display);font-size:14px;color:var(--text-2);display:block}
.rm-wn small{font-size:10.5px;color:var(--text-3);font-family:var(--f-mono)}
.rm-wbody{flex:1;min-width:0}
.rm-wtop{display:flex;align-items:center;gap:10px}
.rm-bw{font-family:var(--f-mono);font-size:14px;font-weight:600}
.rm-here{font-size:9.5px;letter-spacing:1px;font-weight:800;color:#1a1407;background:var(--gold);padding:2px 7px;border-radius:5px}
.rm-tags{margin-top:2px}
/* ---- gym tools / warm-up / plate calc ---- */
.tool{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.tool-h{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer}
.tool-h svg.tic{width:18px;height:18px;color:var(--gold);flex:none}
.tool-h h4{flex:1;font-size:14px;font-weight:700}
.tool-h .chev{color:var(--text-3);transition:transform .2s}
.tool.open .tool-h .chev{transform:rotate(90deg)}
.tool-b{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
.tool.open .tool-b{display:block}
.warmblk{font-size:13px;color:var(--text-2);line-height:1.65;padding-top:12px}
.warmblk b{color:var(--text)}
.plate-row{display:flex;gap:10px;margin:12px 0}
.plate-row .field{flex:1;margin:0}
.plate-out{margin-top:6px}
.plate-vis{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;padding:14px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);min-height:64px}
.plate{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;color:#0A0D14;font-family:var(--f-mono);font-weight:700;font-size:12px}
.bar-stub{width:26px;height:8px;background:linear-gradient(180deg,#cfd6e4,#8b94a8);border-radius:2px}
.plate-txt{text-align:center;font-family:var(--f-mono);font-size:13px;color:var(--text-2);margin-top:10px}
.plate-txt b{color:var(--gold)}
.wu-sets{margin-top:12px}
.wu-set{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:6px;font-family:var(--f-mono);font-size:13px}
.wu-set .wu-p{color:var(--text-3);width:42px}
.wu-set .wu-w{color:var(--gold);font-weight:600;flex:1}
.wu-set .wu-r{color:var(--text-2)}
/* ---- rest timer ---- */
#restTimer{position:fixed;left:50%;transform:translateX(-50%) translateY(200px);bottom:calc(72px + env(safe-area-inset-bottom));z-index:120;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--panel-2),var(--ink-2));border:1px solid var(--cyan-deep);border-radius:999px;padding:10px 14px;box-shadow:var(--sh-lg);transition:transform .3s;min-width:230px;justify-content:space-between}
#restTimer.show{transform:translateX(-50%) translateY(0)}
#restTimer button{background:var(--panel-3);border:1px solid var(--line-2);color:var(--text);border-radius:999px;padding:7px 12px;font-family:var(--f-body);font-weight:700;font-size:12px;cursor:pointer;min-height:40px;min-width:40px}
#restTimer #restEnd{width:40px;padding:7px 0;color:var(--text-2)}
.rt-mid{display:flex;align-items:center;gap:9px}
.rt-lab{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cyan);font-weight:700}
#restTime{font-family:var(--f-mono);font-size:22px;font-weight:600;color:var(--text);min-width:54px;text-align:center}
@media(min-width:760px){#restTimer{bottom:24px}}
/* ---- round-2 audit (27 Sep 2026) ---- */
@media(max-width:420px){.macro-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.log-list.yr .ld{width:74px}

    {id:"pa2",n:"A2",name:"Standing Overhead Press",tag:"Compound · Barbell",cmp:1,sets:3,reps:"6-10",tempo:"3/0/X/0",rest:"2-3 min",rir:"1-2",how:"Stand tall, bar at your collarbone. Brace abs and glutes, press straight overhead to lockout, lower under control. Don't lean back excessively.",why:"The king of shoulder builders. Pressing overhead while standing works all three shoulder heads plus triceps and core, building round, capped delts."},
    {id:"pa3",n:"A3",name:"Weighted Dip (Chest Lean)",tag:"Compound · Bodyweight+ · Stretch",cmp:1,stretch:1,sets:3,reps:"8-12",tempo:"3/1/X/0",rest:"2 min",rir:"1-2",how:"Lean forward ~30°. Lower slowly until you feel a deep chest stretch, then press up. Add weight with a belt once bodyweight is easy.",why:"A top chest and triceps builder. The forward lean and deep stretch hit the lower chest hard — and loading the stretch is the most powerful growth trigger we know."},
    {id:"pa4",n:"A4",name:"Incline Dumbbell Press",tag:"Compound · Dumbbell",cmp:1,sets:3,reps:"8-12",tempo:"3/0/1/0",rest:"90s",rir:"1-2",how:"Bench at ~30°. Press dumbbells from the sides of your upper chest to over your eyes. Lower slowly to a stretch, press up and slightly together.",why:"Targets the upper chest for a full, square look. Dumbbells allow a deeper stretch and longer range than a barbell — more muscle-building tension."},
    {id:"pa5",n:"A5",name:"Cable Fly (Stretch)",tag:"Isolation · Cable · Stretch",cmp:0,stretch:1,sets:3,reps:"12-15",tempo:"3/1/1/0",rest:"90s",rir:"0-1",how:"Cables at shoulder height, slight elbow bend. Bring hands together in a big hugging arc; let them travel back far enough for a strong chest stretch each rep.",why:"Isolates the chest with constant tension and an exaggerated stretch — the position where it grows best. Finishes the chest after heavy pressing."},
    {id:"pa6",n:"A6",name:"Dumbbell Lateral Raise",tag:"Isolation · Dumbbell",cmp:0,sets:4,reps:"12-20",tempo:"2/0/1/1",rest:"75s",rir:"0-1",how:"Light dumbbells at your sides, lean forward slightly. Raise out to the sides to shoulder height, leading with your elbows. Lower slowly. No swinging.",why:"Side delts give your shoulders width. They respond best to lighter weight and higher reps near failure, exactly what this delivers."},
    {id:"pa7",n:"A7",name:"Overhead Triceps Extension",tag:"Isolation · Cable/DB · Stretch",cmp:0,stretch:1,sets:3,reps:"10-15",tempo:"3/1/1/0",rest:"90s",rir:"1-2",how:"Rope on a low cable or one dumbbell in both hands, hands behind your head. Extend overhead, then lower slowly until you feel a deep triceps stretch.",why:"Stretches the largest triceps head (the long head) under load — grows it far more than pushdowns. The most effective triceps move you can do."}
  ]},
  pullA:{name:"Pull A",sub:"Back Thickness",ex:[
    {id:"la1",post:1,n:"A1",name:"Barbell Row (or Pendlay Row)",tag:"Compound · Barbell",cmp:1,sets:4,reps:"6-10",tempo:"3/1/1/0",rest:"2-3 min",rir:"1-2",how:"Hinge forward to ~45°, back flat. Pull the bar to your lower ribs/belly button, squeezing your shoulder blades, then lower under control.",why:"The best back-thickness builder. It loads lats, mid-back, rear delts and biceps with heavy weight for a dense, 3D back that pulldowns alone can't build."},
    {id:"la2",post:1,n:"A2",name:"Weighted Pull-Up or Lat Pulldown",tag:"Compound · Bodyweight+ · Stretch",cmp:1,stretch:1,sets:3,reps:"8-12",tempo:"3/0/1/1",rest:"2 min",rir:"1-2",how:"Grip slightly wider than shoulders. From a full hang (big stretch), pull your chest toward the bar by driving elbows down and back. Lower slowly to full stretch.",why:"The premier lat-width builder, creating the V-taper. Starting from a full stretch each rep maximises lat growth."},
    {id:"la3",post:1,n:"A3",name:"Chest-Supported Row",tag:"Compound · Machine/DB",cmp:1,sets:3,reps:"10-12",tempo:"2/1/1/0",rest:"90s",rir:"1-2",how:"Chest-down on an incline bench or machine. Pull the weight in, squeezing your shoulder blades hard at the top, then lower slowly.",why:"With your chest supported, your lower back can't cheat — all the effort goes into your mid-back, building dense muscle and better posture."},
    {id:"la4",post:1,n:"A4",name:"Cable Pullover",tag:"Isolation · Cable · Stretch",cmp:0,stretch:1,sets:3,reps:"12-15",tempo:"3/1/1/0",rest:"90s",rir:"0-1",how:"Face a high cable, arms nearly straight. Pull the handle down in an arc to your thighs using your lats, then let it rise for a full lat stretch overhead.",why:"Isolates the lats through a long arc with a deep stretch — the lat version of a fly, loading them where growth is greatest."},
    {id:"la5",post:1,n:"A5",name:"Rear-Delt Fly",tag:"Isolation · Cable/DB",cmp:0,sets:3,reps:"15-20",tempo:"2/1/1/0",rest:"60s",rir:"0-1",how:"Bent over or on a reverse pec-deck, raise the weights out to the sides leading with your elbows, squeezing your shoulder blades. Light and strict.",why:"Rear delts complete a 3D shoulder, balance all your pressing and keep your shoulders healthy. High reps with strict form grow them."},
    {id:"la6",n:"A6",name:"Incline Dumbbell Curl",tag:"Isolation · Dumbbell · Stretch",cmp:0,stretch:1,sets:3,reps:"10-12",tempo:"3/0/1/1",rest:"75s",rir:"1-2",how:"Sit back on an incline bench so your arms hang behind your body. Curl up keeping upper arms still, squeeze, lower slowly to a full stretch.",why:"Arms hanging behind you put the biceps in a deep stretch, roughly doubling the growth stimulus versus standing curls. The best biceps-mass move."},
    {id:"la7",n:"A7",name:"Hammer Curl",tag:"Isolation · Dumbbell",cmp:0,sets:2,reps:"12-15",tempo:"2/0/1/0",rest:"60s",rir:"1-2",how:"Palms facing each other (like holding hammers). Curl up without rotating your wrists, lower slowly.",why:"Builds the brachialis (under the biceps) and forearms, adding thickness and width that regular curls miss."},
    {id:"la8",post:1,n:"A8",name:"Heavy Shrug",tag:"Isolation · Barbell/Dumbbell",cmp:0,sets:3,reps:"8-12",tempo:"2/1/1/1",rest:"90s",rir:"0-1",how:"Stand tall, arms straight, shrug vertically toward your ears — no rolling, ever. Hold a full second at the top, then lower until you feel the traps stretch under load.",why:"Traps were the one large posterior muscle this plan never trained directly. They carry visible thickness across the neck and upper back, they tolerate heavy loads well, and they respond to long top-end holds better than to volume."},
    {id:"la9",n:"A9",name:"Standing Calf Raise (Pull-day dose)",tag:"Isolation \u00b7 Machine/DB \u00b7 Calves",cmp:0,sets:3,reps:"15-25",tempo:"2/2/1/1",rest:"60s",rir:"0-1",how:"Full stretch at the bottom with a 2 s pause, drive to a full lock and squeeze. Straight knees hit the gastrocnemius.",why:"Calves grow on frequency more than anything: four sessions a week beats two, and a pull day costs them nothing in recovery."}
  ]},
  legsA:{name:"Legs A",sub:"Quad Focus",ex:[
    {id:"ga1",n:"A1",name:"Barbell Back Squat (or Hack Squat)",tag:"Compound · Barbell/Machine",cmp:1,sets:4,reps:"5-8",tempo:"3/1/X/0",rest:"3 min",rir:"1-2",how:"Bar on upper back, shoulder-width stance. Sit down and back as deep as you can with a flat back, drive up through your whole foot.",why:"The king of lower-body exercises. It loads quads, glutes and hamstrings heavy while building your core and back — nothing matches its total effect."},
    {id:"ga2",post:1,n:"A2",name:"Romanian Deadlift",tag:"Compound · Barbell · Stretch",cmp:1,stretch:1,sets:3,reps:"8-12",tempo:"4/0/1/0",rest:"2-3 min",rir:"1-2",how:"Bar at your thighs, legs almost straight, back flat. Push your hips back and lower the bar down your legs until you feel a deep hamstring stretch. Drive hips forward to stand.",why:"The best hamstring and glute builder. The deep stretch under load is exactly what makes hamstrings grow, and it strengthens your lower back."},
    {id:"ga3",n:"A3",name:"Leg Press",tag:"Compound · Machine",cmp:1,sets:3,reps:"10-15",tempo:"3/0/1/0",rest:"2 min",rir:"1-2",how:"Feet shoulder-width on the platform. Lower by bending your knees toward your chest as far as comfortable, then press up without locking out hard.",why:"Lets you pile on quad and glute volume safely after squats, when your lower back is tired. Deep reps make it a serious leg builder."},
    {id:"ga4",n:"A4",name:"Walking Lunge",tag:"Compound · Dumbbell · Stretch",cmp:1,stretch:1,sets:2,reps:"12-15/leg",tempo:"2/0/1/0",rest:"90s",rir:"1-2",how:"Dumbbells at your sides, walk forward in long strides, dropping your back knee toward the floor each step. Push through your front heel into the next stride.",why:"Trains each leg alone (fixing imbalances) and stretches the glutes under load. Continuous walking keeps constant tension on quads and glutes."},
    {id:"ga5",n:"A5",name:"Leg Extension",tag:"Isolation · Machine",cmp:0,sets:3,reps:"12-15",tempo:"2/1/1/0",rest:"75s",rir:"0-1",how:"Shins behind the pad. Straighten your legs fully, squeeze your quads hard for a second at the top, lower slowly.",why:"Isolates the quads with a strong top squeeze, letting you target them directly to failure safely after the heavy compounds."},
    {id:"ga6",post:1,n:"A6",name:"Seated Leg Curl",tag:"Isolation · Machine · Stretch",cmp:0,stretch:1,sets:3,reps:"10-15",tempo:"3/1/1/0",rest:"75s",rir:"0-1",how:"Pad on the back of your ankles. Curl your heels down and under you as far as possible, squeeze, return slowly to a stretch.",why:"Directly trains the hamstrings stretched (seated beats lying for growth). Balances all the squatting and protects your knees."},
    {id:"ga7",n:"A7",name:"Standing Calf Raise",tag:"Isolation · Machine · Stretch",cmp:0,stretch:1,sets:4,reps:"10-15",tempo:"2/2/1/1",rest:"60s",rir:"0",how:"Balls of your feet on the edge of the platform. Drop your heels down for a deep 2-second stretch, then rise onto your toes and squeeze.",why:"Calves grow from a full range and deep stretch. Pausing 2 seconds at the bottom dramatically increases calf growth versus bouncing."},
    {id:"ga8",post:1,n:"A8",name:"45° Back Extension (Weighted)",tag:"Compound · Bodyweight+ · Stretch",cmp:1,stretch:1,sets:3,reps:"10-12",tempo:"3/1/1/1",rest:"90s",rir:"1-2",how:"Pads at the hip crease, never up on the ribs. Lower slowly, rounding down through the spine, then extend by squeezing glutes and hamstrings until your body is one straight line — stop there, never arch past it. Hug a plate to your chest once bodyweight gets easy.",why:"Erectors, glutes and hamstrings trained together through a full range with almost none of the spinal fatigue a deadlift costs. This is the movement that makes every squat and pull safer while building the thickness that lives behind you."}
  ]},
  pushB:{name:"Push B",sub:"Shoulder Focus",ex:[
    {id:"pb1",n:"B1",name:"Standing Overhead Press (Heavy)",tag:"Compound · Barbell",cmp:1,sets:4,reps:"5-8",tempo:"3/0/X/0",rest:"3 min",rir:"1-2",how:"Today it's your heavy first lift. Bar at collarbone, brace hard, press straight overhead to lockout, lower under control.",why:"Pressing overhead first when fresh lets you move the most weight and build maximum shoulder and triceps mass. Hitting shoulders heavy twice a week drives faster growth."},
    {id:"pb2",n:"B2",name:"Incline Barbell Bench Press",tag:"Compound · Barbell",cmp:1,sets:3,reps:"6-10",tempo:"3/1/X/0",rest:"2-3 min",rir:"1-2",how:"Bench at ~30°. Lower the bar to your upper chest, touch lightly, press up powerfully. Shoulder blades pinned back.",why:"Overloads the upper chest with heavy weight for a full upper-chest shelf. Pairs with Push A's flat bench to develop the whole chest."},
    {id:"pb3",n:"B3",name:"Machine Chest Press",tag:"Compound · Machine",cmp:1,sets:3,reps:"10-12",tempo:"3/0/1/0",rest:"90s",rir:"1-2",how:"Handles at mid-chest height. Press forward until nearly straight, return slowly until you feel a chest stretch.",why:"Lets you push the chest close to failure safely without a spotter after the heavy barbell work. The fixed path puts all effort into the chest."},
    {id:"pb4",n:"B4",name:"Seated Dumbbell Shoulder Press",tag:"Compound · Dumbbell",cmp:1,sets:3,reps:"8-12",tempo:"3/0/1/0",rest:"90s",rir:"1-2",how:"Upright on a bench with back support. Press dumbbells from shoulder height to overhead, lower slowly to just below shoulder level.",why:"Dumbbells allow a deeper, more natural press than a barbell and let each shoulder work alone. More pressing volume means more shoulder and triceps growth."},
    {id:"pb5",n:"B5",name:"Cable Lateral Raise",tag:"Isolation · Cable",cmp:0,sets:4,reps:"15-20",tempo:"2/0/1/1",rest:"60s",rir:"0-1",how:"Side-on to a low cable, handle in the far hand. Raise out to the side to shoulder height, lower slowly. Cable keeps tension the whole way.",why:"Constant cable tension hits the side delts even harder than dumbbells, especially at the bottom. More side-delt volume builds width."},
    {id:"pb6",n:"B6",name:"Rope Triceps Pushdown",tag:"Isolation · Cable",cmp:0,sets:3,reps:"12-15",tempo:"2/0/1/1",rest:"60s",rir:"0-1",how:"Face a high cable with a rope, elbows pinned to your sides. Push down and spread the rope ends apart at the bottom, return slowly.",why:"Targets the outer triceps head for the horseshoe look, complementing Push A's overhead extensions. The spread maximises the squeeze."},
    {id:"pb7",n:"B7",name:"Deep Push-Up or Dip (to failure)",tag:"Compound · Bodyweight",cmp:1,sets:2,reps:"AMRAP",tempo:"2/0/X/0",rest:"75s",rir:"0",how:"Finish with two all-out sets of deep push-ups or dips, going as deep as possible each rep until you can't do another (AMRAP).",why:"A high-rep deep-stretch finisher that floods the chest, shoulders and triceps with blood and growth-stimulating volume. Safe to failure with no heavy load."}
  ]},
  pullB:{name:"Pull B",sub:"Back Width",ex:[
    {id:"lb1",post:1,n:"B1",name:"Weighted Pull-Up / Pulldown (Heavy)",tag:"Compound · Bodyweight+ · Stretch",cmp:1,stretch:1,sets:4,reps:"6-10",tempo:"3/0/1/1",rest:"2-3 min",rir:"1-2",how:"Vertical pulling is your heavy first move today. From a full stretch, pull your chest to the bar, driving elbows down and back. Add weight so 6-10 reps is hard. Lower slowly.",why:"Hitting the lats heavy when fresh maximises width. Training back twice a week (vertical today, horizontal on Pull A) grows it faster and fuller."},
    {id:"lb2",post:1,n:"B2",name:"Seated Cable Row",tag:"Compound · Cable",cmp:1,sets:3,reps:"8-12",tempo:"2/1/1/0",rest:"2 min",rir:"1-2",how:"Feet on the platform, grab the handle. Pull to your stomach, chest up, squeezing your shoulder blades. Return slowly to a full stretch forward.",why:"A staple back-thickness builder with constant tension. The smooth resistance lets you really feel and squeeze the mid-back through a long range."},
    {id:"lb3",post:1,n:"B3",name:"Single-Arm Dumbbell Row",tag:"Compound · Dumbbell",cmp:1,sets:3,reps:"10-12/arm",tempo:"3/1/1/0",rest:"90s",rir:"1-2",how:"One hand and knee on a bench. Pull the dumbbell from a full stretch up to your hip, squeeze, lower slowly. Keep your back flat.",why:"One side at a time lets you move a big weight through a huge range with a deep stretch, fixing imbalances and building thick lats."},
    {id:"lb4",post:1,n:"B4",name:"Straight-Arm Pulldown",tag:"Isolation · Cable · Stretch",cmp:0,stretch:1,sets:3,reps:"12-15",tempo:"3/1/1/0",rest:"75s",rir:"0-1",how:"Face a high cable with a straight bar, arms nearly straight. Pull the bar to your thighs in an arc using only your lats, let it rise to a full stretch.",why:"Isolates the lats with a strong stretch, teaching you to use them and adding width-focused volume without the biceps. A great lat finisher."},
    {id:"lb5",post:1,n:"B5",name:"Face Pull",tag:"Isolation · Cable",cmp:0,sets:3,reps:"15-20",tempo:"2/1/1/0",rest:"60s",rir:"0-1",how:"Rope at face height. Pull toward your forehead, splitting the rope apart and squeezing your rear shoulders and upper back. Return slowly.",why:"Builds rear delts and upper back while keeping your shoulders healthy against all the pressing. Essential prehab that adds back detail."},
    {id:"lb6",n:"B6",name:"Preacher or Cable Curl",tag:"Isolation · Machine/Cable",cmp:0,sets:3,reps:"10-15",tempo:"3/0/1/1",rest:"75s",rir:"0-1",how:"On a preacher bench or low cable, curl up with strict form, squeeze hard at the top, lower slowly. No swinging.",why:"Keeps constant tension on the biceps and removes momentum, forcing the muscle to do all the work. A different angle than Pull A for complete arms."},
    {id:"lb7",n:"B7",name:"Reverse Curl",tag:"Isolation · Barbell/Cable",cmp:0,sets:2,reps:"12-15",tempo:"2/0/1/0",rest:"60s",rir:"1-2",how:"Palms facing down on a bar. Curl up keeping your wrists firm, lower slowly.",why:"Hammers the forearms and brachialis for thicker arms and a stronger grip that carries over to all your pulling."},
    {id:"lb8",post:1,n:"B8",name:"Prone Y-Raise (Lower Trap)",tag:"Isolation · Dumbbell · Prehab",cmp:0,sets:3,reps:"12-15",tempo:"2/1/2/1",rest:"60s",rir:"1-2",how:"Face down, arms out in a Y at about 45°, thumbs pointing up. Raise light weights by driving your shoulder blades down and back into your pockets, pause at the top, lower slowly. 5 kg is plenty — this is not a strength contest.",why:"Lower traps position the shoulder blade for every press and every row. On a six-day plan carrying this much pressing volume, they are the best insurance available against the shoulder injury that ends a bulk."},
    {id:"lb9",n:"B9",name:"Seated Calf Raise (Pull-day dose)",tag:"Isolation \u00b7 Machine/DB \u00b7 Calves",cmp:0,sets:3,reps:"15-25",tempo:"2/2/1/1",rest:"60s",rir:"0-1",how:"Bent knee takes the gastrocnemius out and loads the soleus, the deep calf that gives the lower leg its width. Pause 2 s at the bottom.",why:"Soleus is half the calf and only trains bent-knee. Standing on one day, seated on another \u2014 that is \u2018all round\u2019."}
  ]},
  legsB:{name:"Legs B",sub:"Posterior Focus",ex:[
    {id:"gb1",post:1,n:"B1",name:"Deadlift (Conventional / Trap Bar)",tag:"Compound · Barbell",cmp:1,sets:4,reps:"4-6",tempo:"2/0/X/0",rest:"3-4 min",rir:"1-2",how:"Bar over mid-foot. Grip it, flatten your back, take the slack out, then stand by driving your feet down and hips forward. Lower under control. Trap bar is easier on the back.",why:"The most complete posterior-chain builder there is — hamstrings, glutes, back and traps under more load than any other lift. Builds full-body strength and dense muscle."},
    {id:"gb2",n:"B2",name:"Bulgarian Split Squat",tag:"Compound · Dumbbell · Stretch",cmp:1,stretch:1,sets:3,reps:"8-12/leg",tempo:"3/1/1/0",rest:"2 min",rir:"1-2",how:"Back foot on a bench behind you, dumbbells in hand. Lower straight down until your back knee nearly touches and your front thigh is parallel, drive up through your front heel.",why:"One of the best single-leg builders. It loads one leg through a deep, stretched range, matching barbell squats for quad and glute growth while fixing imbalances."},
    {id:"gb3",post:1,n:"B3",name:"Hip Thrust",tag:"Compound · Barbell",cmp:1,sets:3,reps:"10-15",tempo:"2/2/1/0",rest:"90s",rir:"0-1",how:"Upper back on a bench, padded barbell across your hips. Drive through your heels until your body is straight from shoulders to knees, squeeze your glutes hard for 2 seconds.",why:"The #1 glute builder in research. The 2-second squeeze where the glutes are fully shortened is exactly where they work hardest, building powerful, fuller glutes."},
    {id:"gb4",post:1,n:"B4",name:"Lying Leg Curl",tag:"Isolation · Machine · Stretch",cmp:0,stretch:1,sets:4,reps:"10-15",tempo:"3/1/1/0",rest:"75s",rir:"0-1",how:"Face-down, pad on the back of your ankles. Curl your heels toward your glutes, squeeze, lower slowly to a full stretch.",why:"Targets the hamstrings from a different angle than seated curls, ensuring complete development and balancing the heavy hinging."},
    {id:"gb5",n:"B5",name:"Hack Squat / Leg Press (Quad)",tag:"Compound · Machine",cmp:1,sets:3,reps:"10-15",tempo:"3/0/1/0",rest:"2 min",rir:"1-2",how:"Feet lower/narrower to bias the quads. Lower deep keeping tension, press up without locking hard.",why:"Adds heavy quad-focused volume in a back-friendly way after deadlifts. Going deep loads the quads fully on your second leg day."},
    {id:"gb6",n:"B6",name:"Seated Calf Raise",tag:"Isolation · Machine · Stretch",cmp:0,stretch:1,sets:4,reps:"15-20",tempo:"2/2/1/1",rest:"60s",rir:"0",how:"Pad over your knees, balls of your feet on the platform. Drop your heels for a deep 2-second stretch, rise up and squeeze.",why:"The seated version targets the deeper calf muscle (soleus), most of your calf size. With standing raises on Legs A, this builds complete calves."},
    {id:"gb7",n:"B7",name:"Weighted Cable Crunch / Hanging Leg Raise",tag:"Core · Cable/Bodyweight",cmp:0,sets:3,reps:"10-15",tempo:"2/1/2/0",rest:"60s",rir:"1-2",how:"Cable crunch: kneel facing the machine, rope behind your head, crunch your ribs to your hips. Or hang and raise your knees/legs under control.",why:"Loaded ab training builds a thicker, more visible six-pack as you grow. Adding resistance grows the abs just like any other muscle."},
    {id:"gb8",post:1,n:"B8",name:"Nordic Hamstring Curl (Eccentric)",tag:"Isolation · Bodyweight · Eccentric",cmp:0,sets:3,reps:"5-8",tempo:"5/0/X/0",rest:"2 min",rir:"0-1",how:"Anchor your heels under something immovable, knees on the mat, body straight from knee to shoulder. Lower forward as slowly as you can — five seconds is the target — then catch yourself with your hands and push back to the top. The lowering is the whole exercise.",why:"The strongest evidence base of any hamstring movement: heavy eccentric knee-flexion builds hamstring strength and length, and roughly halves hamstring injury risk. Machine curls train the same muscle — nothing loads it like this."},
    {id:"gb9",n:"B9",name:"Tibialis Raise",tag:"Isolation \u00b7 Bodyweight+ \u00b7 Calves all round",cmp:0,sets:3,reps:"20-25",tempo:"2/1/2/0",rest:"45s",rir:"0-1",how:"Heels on the floor, lean back against something solid, lift the toes as high as they go and hold a beat. Add a small plate or dumbbell across the toes once 25 reps come easy.",why:"The front of the shin is the muscle that makes calves look complete from the front and protects the shins and knees. Almost nobody trains it; it responds fast."}
  ]},
  upperA:{name:"Upper",sub:"2nd Chest/Back/Shoulder Hit",ex:[
    {id:"ua1",n:"U1",name:"Incline Barbell Bench Press",tag:"Compound · Barbell",cmp:1,sets:4,reps:"6-10",tempo:"3/1/X/0",rest:"2-3 min",rir:"1-2",how:"Bench at ~30°. Lower the bar to your upper chest, touch lightly, then press up powerfully. Shoulder blades pinned back, feet planted.",why:"Your second heavy chest session of the week hits the upper chest specifically. Training a muscle twice a week beats once for growth — this is the frequency that drives gains."},
    {id:"ua2",post:1,n:"U2",name:"Weighted Pull-Up or Lat Pulldown",tag:"Compound · Bodyweight+ · Stretch",cmp:1,stretch:1,sets:4,reps:"8-12",tempo:"3/0/1/1",rest:"2 min",rir:"1-2",how:"Grip slightly wider than shoulders. From a full hang (big stretch), pull your chest toward the bar by driving your elbows down. Lower slowly to a full stretch.",why:"A second weekly lat session for width and that V-taper. Starting from a deep stretch each rep is the strongest growth trigger for the lats."},
    {id:"ua3",n:"U3",name:"Seated Dumbbell Shoulder Press",tag:"Compound · Dumbbell",cmp:1,sets:3,reps:"8-12",tempo:"3/0/1/0",rest:"90s",rir:"1-2",how:"Upright on a bench with back support. Press dumbbells from shoulder height to overhead, lower slowly to just below shoulder level.",why:"Builds round, capped shoulders. Dumbbells move through a deeper, more natural range than a barbell and let each side work on its own."},
    {id:"ua4",post:1,n:"U4",name:"Seated Cable Row",tag:"Compound · Cable",cmp:1,sets:3,reps:"10-12",tempo:"2/1/1/0",rest:"90s",rir:"1-2",how:"Feet on the platform, grab the handle. Pull to your stomach, chest up, squeezing your shoulder blades. Return slowly to a full stretch forward.",why:"Adds mid-back thickness with constant tension. The smooth resistance lets you really feel and squeeze the back through a long range."},
    {id:"ua5",n:"U5",name:"Dumbbell Lateral Raise",tag:"Isolation · Dumbbell",cmp:0,sets:4,reps:"12-20",tempo:"2/0/1/1",rest:"60s",rir:"0-1",how:"Light dumbbells at your sides, lean forward slightly. Raise out to the sides to shoulder height, leading with your elbows. Lower slowly. No swinging.",why:"Side delts give your shoulders their width — the difference between a narrow and a capped look. They thrive on lighter weight and high reps."},
    {id:"ua6",n:"U6",name:"EZ-Bar or Cable Curl",tag:"Isolation · Barbell/Cable",cmp:0,sets:3,reps:"10-12",tempo:"3/0/1/1",rest:"75s",rir:"0-1",how:"Curl up with strict form, squeeze hard at the top, lower slowly under control. No swinging or using your back.",why:"Direct biceps volume on top of all your pulling — the extra work grows the arms faster. A second weekly hit means quicker results."},
    {id:"ua7",n:"U7",name:"Rope Triceps Pushdown",tag:"Isolation · Cable",cmp:0,sets:3,reps:"12-15",tempo:"2/0/1/1",rest:"60s",rir:"0-1",how:"Face a high cable with a rope, elbows pinned to your sides. Push down and spread the rope apart at the bottom, return slowly.",why:"Triceps are most of your arm size. This direct work, twice a week with your pressing, fills out the back of the arm fast."}

function winHorizon(){

  while(c.ceilLean-lean>0.3&&mo<180){const r=Math.min(0.30,0.30*((c.ceilLean-lean)/4));lean+=r;mo++;}

}

  <div class="calc-note" style="margin-top:10px"><b>The sequence:</b> Base block, weeks 1\u201316 \u2014 the full 6-day week exactly as written, every muscle twice. Then 6-week <b>specialisation blocks</b> rotating Posterior chain \u2192 Legs \u2192 Delts & arms \u2192 Chest & back width, and around again. In a specialisation block the emphasised region takes 16\u201320 hard sets a week; everything else stays on its base dose. The total weekly work rises by the block\u2019s extra sets, so recovery is the limit: if sleep or performance slips, take the other muscles down to a 6\u20138-set maintenance dose for the block, which holds size at near-zero recovery cost.</div>
  <div class="calc-note" style="margin-top:10px"><b>Why it is faster:</b> muscle grows in proportion to hard sets it can actually recover from. Six days of everything-at-once caps every region at the same modest dose. Focusing the dose on one region for six weeks \u2014 then moving on while it holds \u2014 pushes each region past the plateau it would otherwise sit at. Deload weeks stay exactly where the roadmap puts them (every 6th week); they fall inside blocks and that is fine.</div>

function estimateBF(){const h=parseFloat(DB.profile.height)||177;const rows=[...DB.measure].filter(x=>x.waist!=null&&x.neck!=null&&x.waist>x.neck).sort((a,b)=>String(b.date).localeCompare(String(a.date)));if(!rows.length)return null;const m=rows[0];const bf=495/(1.0324-0.19077*Math.log10(m.waist-m.neck)+0.15456*Math.log10(h))-450;if(!(bf>3&&bf<60))return null;return {bf:Math.round(bf*10)/10,date:m.date,waist:m.waist,neck:m.neck};}
