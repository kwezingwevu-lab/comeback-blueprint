# FPL Mission Control — QA gate (fpl/ only; the fitness app at the repo root has its own harness)
#
# CLAUDE.md K1: every push runs qa/; red blocks merge. Every step fails the job on a non-zero
# exit, and the final step fails the job if the literal "FAIL" appears anywhere in the combined
# suite log.
#
# THE STEP ORDER HERE IS THE SAME LIST, IN THE SAME ORDER, AS fpl/qa/run.sh. A suite in one
# runner and not the other is how a red lands on main. `bash qa/run.sh --dry-run` prints run.sh's
# list from its own call sites; read it next to this file. The groups are:
#
#   0-4  tdz(sources) · esbuild · build · tdz(built app)
#   A    cheap and deterministic  privacy · no_frozen · visual
#   B    data                     validate_live · waiver_log · prices · verify.sh · pull_guard
#   C    engine and render        unit_engine · components          (node, no browser)
#   D    browser                  smoke · smoke_wk · realistic · buttons · webkit · ios · browser.py
#   E    million-iteration        mc_full · mc_all
#
# Cheapest and most deterministic first: measured on the dev machine 26 September 2026, group A
# is 291 ms and group B's first three are 240 ms, against 8.8 s for verify.sh and 12.6 s for
# pull_guard (which stands up a real HTTP server). The browser INSTALL step also sits after
# group C on purpose — a red in groups A to C then arrives before the runner spends a couple of
# minutes downloading three browsers.
#
# Browser note: the CI runner has no /opt/pw-browsers, so the browsers are installed here,
# before group D, and never by a suite.
#   · qa/harness.cjs (smoke, smoke_wk, realistic, buttons) prefers /opt/pw-browsers/chromium and
#     falls back to Playwright's own install when that path is absent (CONTRACT.md §8; E-027).
#   · qa/webkit.js launches playwright.webkit directly — the manager reads this app on an iPhone,
#     so the Part G gates and the storage paths are measured on both engines.
#   · qa/browser.py is Python Playwright and does NOT fall back: it requires the literal path
#     /opt/pw-browsers/chromium and prints a named FAIL when it is missing. The install step
#     below creates that path on the runner with the same `chromium` symlink the dev sandbox
#     has. Consequence worth knowing: once it exists, harness.cjs prefers it too, so the
#     Chromium suites on CI drive that binary rather than Playwright's default cache. Both are
#     the build that Playwright 1.63.0 ships, so this is the same browser by another path.
#
# Python needs its own setup step (actions/setup-node does not provide one) and its own
# Playwright package — the Node package in fpl/node_modules is a different install and Python
# cannot import it.
name: fpl-gate

on:
  workflow_dispatch:   # v110 E7: refresh.yml starts the full gate on its refresh/<date> branch this way; a push or pull request made with GITHUB_TOKEN starts nothing
  push:
    paths:
      - "fpl/**"
      - ".github/workflows/gate.yml"
  pull_request:
    paths:
      - "fpl/**"
      - ".github/workflows/gate.yml"

defaults:
  run:
    working-directory: fpl
    shell: bash   # GitHub runs an explicit bash as `bash -eo pipefail`, so a suite failing behind `tee` still fails the step

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GATE_LOG: ${{ github.workspace }}/gate.log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fpl/package-lock.json

      # qa/browser.py is Python. No pip cache: nothing in fpl/ pins Playwright for Python yet,
      # so there is no dependency file to key a cache on (see the note in the report — a
      # qa/requirements.txt would be the right home for it, and that file is not mine to add).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (npm ci)
        run: npm ci 2>&1 | tee -a "$GATE_LOG"

      # ---------------------------------------------------------------- 0-4

      - name: TDZ check (self-test + sources)
        run: node qa/tdz_check.cjs --self-test 2>&1 | tee -a "$GATE_LOG" && node qa/tdz_check.cjs src/engine.js src/ui.jsx 2>&1 | tee -a "$GATE_LOG"

      # Same flags as run.sh's esbuild gate, which adds --jsx=automatic, silences the one named warning class explained
      # there (the engine's guarded module.exports tail) and pins the version by refusing to fetch one. Only the outfile
      # differs: this one writes a real file.
      - name: esbuild syntax gate (real bundle)
        run: npx --no-install esbuild app/FPL_Mission_Control.jsx --bundle --loader:.jsx=jsx --jsx=automatic --log-override:commonjs-variable-in-esm=silent --outfile=/tmp/mc.js 2>&1 | tee -a "$GATE_LOG"

      - name: build (build.cjs -> app/ + dist/)
        run: node build.cjs 2>&1 | tee -a "$GATE_LOG"

      - name: TDZ check (freshly built app)
        run: node qa/tdz_check.cjs app/FPL_Mission_Control.jsx 2>&1 | tee -a "$GATE_LOG"

      # ---------------------------------------------------------------- A · cheap + deterministic

      - name: privacy (rival managers' names are never committed)
        run: node qa/privacy.cjs 2>&1 | tee -a "$GATE_LOG"

      - name: no_frozen (no live-sourced field asserted against a literal)
        run: node qa/no_frozen.cjs 2>&1 | tee -a "$GATE_LOG"

      # A missing suite is named, not a MODULE_NOT_FOUND stack. It is still a red: a suite this
      # file runs and the repository does not hold is a hole, and silence about it is worse.
      - name: visual (contrast and layout assertions)
        run: |
          test -f qa/visual.cjs || { echo "FAIL visual.cjs — qa/visual.cjs does not exist (suite not written)" 2>&1 | tee -a "$GATE_LOG"; exit 1; }
          node qa/visual.cjs 2>&1 | tee -a "$GATE_LOG"

      # ---------------------------------------------------------------- B · data

      - name: validate_live (snapshot shape)
        run: node data/validate_live.cjs 2>&1 | tee -a "$GATE_LOG"

      - name: waiver_log (the waiver model reproduces the league's own log)
        run: node qa/waiver_log.cjs 2>&1 | tee -a "$GATE_LOG"

      - name: prices (selling prices against the reference's recorded numbers)
        run: node qa/prices.cjs 2>&1 | tee -a "$GATE_LOG"

      - name: parity (the v111 engine module against the reference's golden numbers, B1-B9)
        run: node qa/parity.cjs 2>&1 | tee -a "$GATE_LOG"

      - name: bake (the bake reproduces the reference block; recon, free transfers, transfer log, INTEL — A2, A4-A7)
        run: node qa/bake.cjs 2>&1 | tee -a "$GATE_LOG"

      - name: export_hash (the solver input reproduces the reference's with the same content hash; stable under a re-bake, moved by a changed input — A8)
        run: node qa/export_hash.cjs 2>&1 | tee -a "$GATE_LOG"

      - name: calibration (the calibration stage reproduces the kit's model block; the backtest is uncalibrated and idempotent; the committed block carries it — A9)
        run: node qa/calibration.cjs 2>&1 | tee -a "$GATE_LOG"

      # E3. The suite itself fails loudly when the plan file is absent (a FAIL line and exit 1): a gate that runs
      # without a plan proves nothing. data/plan_reference.json is the reference solve through pipeline/plan.cjs.
      - name: plan_legality (every week of the shipped plan obeys the rules; the ledger replayed, never the solver's fields — E3, C1-C3, C5)
        run: node qa/plan_legality.cjs --plan=data/plan.json 2>&1 | tee -a "$GATE_LOG"

      - name: plan_legality reference (the reference input re-solved by the ported optimiser against the C acceptance in golden.json; the spec's tolerance plus an objective at least the recorded incumbent's, E-106 — C1, C2, C4, C5)
        run: node qa/plan_legality.cjs --plan=data/plan_reference.json --data=reference/v109/app/data.json --golden=reference/v109/app/golden.json 2>&1 | tee -a "$GATE_LOG"

      - name: verify.sh (live reconciliation + invariants)
        run: bash qa/verify.sh 2>&1 | tee -a "$GATE_LOG"

      - name: pull_guard (the pull keeps the last good feed)
        run: node qa/pull_guard.cjs 2>&1 | tee -a "$GATE_LOG"

      # E6. The optimiser's Python dependencies (scipy>=1.11 for scipy.optimize.milp on HiGHS, numpy), pinned in
      # pipeline/requirements.txt. An install step like npm ci, not a suite: run.sh --dry-run does not list it.
      - name: pip install -r pipeline/requirements.txt (the optimiser's dependencies, for the solver smoke)
        run: python3 -m pip install --disable-pip-version-check -r pipeline/requirements.txt 2>&1 | tee -a "$GATE_LOG"

      # A 30-second solve through pipeline/solve.py, pipeline/plan.cjs and the legality shape checks (the gap check
      # skipped by an explicit flag, and the script says so). The full optimiser never runs on push; data/plan.json
      # is written only by the solve stage on an idle machine. About 55 s on the dev machine.
      - name: solver_smoke (a 30-second solve must return a legal plan; the full optimiser never runs on push — E6, C6)
        run: bash qa/solver_smoke.sh 2>&1 | tee -a "$GATE_LOG"

      # ---------------------------------------------------------------- C · engine and render

      - name: unit_engine
        run: node qa/unit_engine.cjs 2>&1 | tee -a "$GATE_LOG"

      # react-dom/server, no browser — which is why it runs before the browser install.
      - name: components (render output)
        run: node qa/components.cjs 2>&1 | tee -a "$GATE_LOG"

      # v110 D4 Odds and D5 Review under react-dom/server: first paint, a source per match, the override round trip.
      - name: mc_render (the Odds and Review tabs)
        run: node qa/mc_render.cjs 2>&1 | tee -a "$GATE_LOG"

      # v110 E1: the kit's reference suites ported against the ported engine, the baked block and the plan; node only.
      - name: mc_data (E1 data)
        run: node qa/mc_data.cjs 2>&1 | tee -a "$GATE_LOG"
      - name: mc_maths (E1 maths and market)
        run: node qa/mc_maths.cjs 2>&1 | tee -a "$GATE_LOG"
      - name: mc_projections (E1 projections)
        run: node qa/mc_projections.cjs 2>&1 | tee -a "$GATE_LOG"
      - name: mc_rules (E1 rules, CLAUDE.md Part N)
        run: node qa/mc_rules.cjs 2>&1 | tee -a "$GATE_LOG"
      - name: mc_separation (E1 separation, the two games never mix)
        run: node qa/mc_separation.cjs 2>&1 | tee -a "$GATE_LOG"
      - name: mc_property (E1 property, at least 3,900 generated cases)
        run: node qa/mc_property.cjs 2>&1 | tee -a "$GATE_LOG"
      - name: mc_simulation (E1 simulation)
        run: node qa/mc_simulation.cjs 2>&1 | tee -a "$GATE_LOG"
      - name: mc_optimisers (E1 optimisers)
        run: node qa/mc_optimisers.cjs 2>&1 | tee -a "$GATE_LOG"

      # ---------------------------------------------------------------- browsers for group D

      - name: Install Playwright browsers (the runner has no /opt/pw-browsers)
        run: |
          set -euo pipefail
          # Node suites: Chromium for harness.cjs, WebKit for qa/webkit.js.
          npx playwright install --with-deps chromium 2>&1 | tee -a "$GATE_LOG"
          npx playwright install --with-deps webkit 2>&1 | tee -a "$GATE_LOG"
          # Python suite: pin the package to the same version package.json pins for the Node
          # suites, so both drive the same browser build rather than two revisions.
          PW_VER="$(node -p "require('./package.json').devDependencies.playwright")"
          echo "pinning Playwright for Python to $PW_VER (package.json)" 2>&1 | tee -a "$GATE_LOG"
          python3 -m pip install --disable-pip-version-check "playwright==$PW_VER" 2>&1 | tee -a "$GATE_LOG"
          # qa/browser.py requires the literal path /opt/pw-browsers/chromium and never installs
          # anything itself. Reproduce the dev sandbox's layout: the browsers under
          # /opt/pw-browsers, plus a `chromium` symlink to the executable.
          sudo mkdir -p /opt/pw-browsers
          sudo chown "$(id -u):$(id -g)" /opt/pw-browsers
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers python3 -m playwright install chromium 2>&1 | tee -a "$GATE_LOG"
          CHROME="$(PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers python3 -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$CHROME" || { echo "FAIL playwright-install — Python Playwright reports $CHROME, which is not executable" 2>&1 | tee -a "$GATE_LOG"; exit 1; }
          ln -sfn "$CHROME" /opt/pw-browsers/chromium
          echo "/opt/pw-browsers/chromium -> $(readlink /opt/pw-browsers/chromium)" 2>&1 | tee -a "$GATE_LOG"
          /opt/pw-browsers/chromium --version 2>&1 | tee -a "$GATE_LOG"

      # ---------------------------------------------------------------- D · browser suites

      - name: smoke
        run: node qa/smoke.cjs 2>&1 | tee -a "$GATE_LOG"

      - name: smoke_wk
        run: node qa/smoke_wk.cjs 2>&1 | tee -a "$GATE_LOG"

      - name: realistic
        run: node qa/realistic.cjs 2>&1 | tee -a "$GATE_LOG"

      - name: buttons
        run: node qa/buttons.cjs 2>&1 | tee -a "$GATE_LOG"

      - name: webkit (Safari-engine acceptance)
        run: node qa/webkit.js 2>&1 | tee -a "$GATE_LOG"

      - name: ios (iOS 27 acceptance on iPhone 17 profiles, WebKit)
        run: IOS_SHOTS="$RUNNER_TEMP/ios-shots" node qa/ios.cjs 2>&1 | tee -a "$GATE_LOG"

      # E5 phone render, 390x844 in light and dark. Python, so its exit code is captured and
      # reported explicitly; a missing interpreter or a missing Playwright is a named FAIL and
      # never a silent skip. qa/browser.py takes no arguments.
      - name: browser.py (E5 phone render, 390x844 light and dark)
        run: |
          test -f qa/browser.py || { echo "FAIL browser.py — qa/browser.py does not exist (suite not written)" 2>&1 | tee -a "$GATE_LOG"; exit 1; }
          command -v python3 >/dev/null || { echo "FAIL browser.py — no python3 on PATH" 2>&1 | tee -a "$GATE_LOG"; exit 1; }
          python3 -c 'import sys; print("interpreter python3 " + sys.version.split()[0])' 2>&1 | tee -a "$GATE_LOG"
          python3 -c 'import playwright.sync_api' || { echo "FAIL browser.py — Playwright for Python is not importable; the install step above did not take" 2>&1 | tee -a "$GATE_LOG"; exit 1; }
          set +e
          python3 qa/browser.py 2>&1 | tee -a "$GATE_LOG"
          rc=${PIPESTATUS[0]}
          set -e
          echo "browser.py exit $rc" 2>&1 | tee -a "$GATE_LOG"
          exit "$rc"

      # ---------------------------------------------------------------- E · million-iteration

      - name: mc_full 3000
        run: node --stack-size=4000 qa/mc_full.cjs 3000 2>&1 | tee -a "$GATE_LOG"

      - name: mc_all
        run: node qa/mc_all.cjs 2>&1 | tee -a "$GATE_LOG"

      # ---------------------------------------------------------------- verdict

      - name: No line starting FAIL in the combined log
        if: always()
        run: |
          if [ ! -s "$GATE_LOG" ]; then echo "gate log missing or empty"; exit 1; fi
          # Anchored at line start (E-141): mutation proofs quote the check they turned red and must not count.
          bash qa/fail_scan.sh --self-test
          bash qa/fail_scan.sh "$GATE_LOG"
