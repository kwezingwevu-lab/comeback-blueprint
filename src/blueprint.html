<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Comeback Blueprint — Pure Muscle · FFMI 25</title>
<meta name="theme-color" content="#0A0D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comeback">
<meta name="description" content="Your unified strength + 15K race plan, calculators, logging and a 2-year roadmap.">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230A0D14'/%3E%3Cpath d='M40 138L70 70l22 36 22-50 36 82' fill='none' stroke='%23FFC53D' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0D14;--ink-2:#0E121B;--panel:#141925;--panel-2:#1A2030;--panel-3:#222A3D;
  --line:#2A3346;--line-2:#374257;--text:#F3F6FC;--text-2:#9FAAC0;--text-3:#6B7894;
  --gold:#FFC53D;--gold-2:#FFD970;--gold-deep:#E0A012;          /* STRENGTH pillar */
  --cyan:#3FD8C8;--cyan-2:#6FE9DC;--cyan-deep:#23A99B;          /* ENDURANCE pillar */
  --go:#42D77D;--warn:#F0883E;--danger:#F65B5B;--violet:#9D8CFF;
  --f-display:'Space Grotesk',-apple-system,system-ui,sans-serif;
  --f-body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r-sm:9px;--r:13px;--r-lg:18px;--r-xl:24px;
  --sh:0 6px 24px rgba(0,0,0,.4);--sh-lg:0 16px 50px rgba(0,0,0,.55);
  --glow-gold:0 0 0 1px rgba(255,197,61,.3),0 10px 30px rgba(255,197,61,.22);
  --glow-cyan:0 0 0 1px rgba(63,216,200,.3),0 10px 30px rgba(63,216,200,.2);
  --maxw:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);background:var(--ink);color:var(--text);line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased;padding-bottom:96px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(680px 380px at 82% -10%,rgba(255,197,61,.09),transparent 60%),radial-gradient(620px 380px at 8% -5%,rgba(63,216,200,.08),transparent 58%)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px;position:relative;z-index:1}

header.app{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(10,13,20,.97),rgba(10,13,20,.85));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.head-inner{max-width:var(--maxw);margin:0 auto;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:42px;height:42px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--gold-2) 0%,var(--gold-deep) 48%,var(--cyan-deep) 100%);box-shadow:0 6px 18px rgba(255,197,61,.28),inset 0 1px 0 rgba(255,255,255,.4);display:grid;place-items:center}
.mark svg{width:24px;height:24px}
.brand-txt h1{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.05}
.brand-txt span{font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-3);font-weight:700}
.cd{display:flex;gap:7px;flex:none}
.cd-box{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 11px;text-align:center;min-width:50px}
.cd-box b{font-family:var(--f-mono);font-size:16px;font-weight:600;color:var(--cyan);display:block;line-height:1.1}
.cd-box small{font-size:8.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);font-weight:700}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:60;background:linear-gradient(0deg,var(--ink-2),rgba(14,18,27,.95));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:flex-start;gap:2px;padding:8px 2px calc(8px + env(safe-area-inset-bottom));overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .tab{flex:1 0 12.5%}
.tab{flex:1;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px;border-radius:10px;color:var(--text-3);font-family:var(--f-body);transition:color .15s}
.tab svg{width:21px;height:21px;stroke-width:2;fill:none;stroke:currentColor}
.tab span{font-size:9.5px;font-weight:700;letter-spacing:.2px}
.tab.active{color:var(--gold)}
.tab.active.run{color:var(--cyan)}
.tab.active svg{filter:drop-shadow(0 0 6px rgba(255,197,61,.5))}
.tab.active.run svg{filter:drop-shadow(0 0 6px rgba(63,216,200,.5))}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.view{display:none;padding:22px 0 40px;animation:fade .3s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:7px}
.eyebrow.cyan{color:var(--cyan)}
.view-title{font-family:var(--f-display);font-size:33px;font-weight:700;letter-spacing:-.8px;line-height:1;margin-bottom:6px}
.view-sub{color:var(--text-2);font-size:14.5px;margin-bottom:22px;max-width:64ch}

/* dual hero */
.hero{position:relative;background:linear-gradient(155deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r-xl);padding:24px;margin-bottom:16px;overflow:hidden;box-shadow:var(--sh)}
.hero::after{content:"";position:absolute;top:-70px;right:-50px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(63,216,200,.13),transparent 65%);pointer-events:none}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;flex-wrap:wrap}
.hero-race{min-width:0}
.hero-race .hr-l{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-bottom:6px}
.hero-race .hr-d{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.5px}
.hero-race .hr-s{font-size:12.5px;color:var(--text-2);margin-top:6px;font-family:var(--f-mono)}
.cd-ring{flex:none;position:relative;width:104px;height:104px}
.cd-ring svg{transform:rotate(-90deg)}
.cd-lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd-lab b{font-family:var(--f-mono);font-size:26px;font-weight:700;line-height:1;color:var(--cyan)}
.cd-lab small{font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-top:3px}

.pillars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.pillar{border-radius:var(--r-lg);padding:16px;border:1px solid var(--line);position:relative;overflow:hidden}
.pillar.str{background:linear-gradient(155deg,rgba(255,197,61,.08),var(--panel))}
.pillar.end{background:linear-gradient(155deg,rgba(63,216,200,.08),var(--panel))}
.pillar .pi{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pillar .pi svg{width:18px;height:18px}
.pillar.str .pi svg{color:var(--gold)}.pillar.end .pi svg{color:var(--cyan)}
.pillar .pi span{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
.pillar.str .pi span{color:var(--gold)}.pillar.end .pi span{color:var(--cyan)}
.pillar .pv{font-family:var(--f-mono);font-size:24px;font-weight:600;line-height:1}
.pillar .pl{font-size:11.5px;color:var(--text-2);margin-top:5px}
.pillar .pmeta{font-family:var(--f-mono);font-size:11px;color:var(--text-3);margin-top:8px}

/* today card */
.today{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px}
.today-band{padding:14px 18px;display:flex;align-items:center;gap:12px}
.today-band.lift{background:linear-gradient(90deg,rgba(255,197,61,.14),transparent)}
.today-band.run{background:linear-gradient(90deg,rgba(63,216,200,.14),transparent)}
.today-band.rest{background:linear-gradient(90deg,rgba(157,140,255,.12),transparent)}
.tb-ic{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center}
.today-band.lift .tb-ic{background:rgba(255,197,61,.15);color:var(--gold)}
.today-band.run .tb-ic{background:rgba(63,216,200,.15);color:var(--cyan)}
.today-band.rest .tb-ic{background:rgba(157,140,255,.15);color:var(--violet)}
.tb-ic svg{width:22px;height:22px}
.tb-txt .tb-day{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);font-weight:700}
.tb-txt .tb-title{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.2px}
.today-body{padding:16px 18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--text-2);line-height:1.6}
.today-body b{color:var(--text)}

/* week strip */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.wd{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 4px;text-align:center}
.wd.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.wd .wdn{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-bottom:5px}
.wd .wdi{width:24px;height:24px;border-radius:7px;margin:0 auto;display:grid;place-items:center}
.wd .wdi svg{width:14px;height:14px}
.wd .wdi.lift{background:rgba(255,197,61,.15);color:var(--gold)}
.wd .wdi.run{background:rgba(63,216,200,.15);color:var(--cyan)}
.wd .wdi.rest{background:rgba(110,120,148,.12);color:var(--text-3)}
.wd .wdl{font-size:8.5px;color:var(--text-2);margin-top:4px;font-weight:600;line-height:1.2}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:16px}
.card-t{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:4px;display:flex;align-items:center;gap:9px}
.card-t .ic{color:var(--gold);display:inline-flex}
.card-t.cyan .ic{color:var(--cyan)}
.card-st{font-size:13px;color:var(--text-3);margin-bottom:16px}
.prose{font-size:14px;color:var(--text-2);line-height:1.68}
.prose p{margin-bottom:11px}.prose b{color:var(--text);font-weight:700}
.prose .hl{color:var(--gold);font-weight:700}.prose .hlc{color:var(--cyan);font-weight:700}

.note{padding:13px 15px;border-radius:var(--r);font-size:13px;line-height:1.6;margin-bottom:12px}
.note.gold{background:rgba(255,197,61,.08);border:1px solid rgba(255,197,61,.25);color:#f0d79a}
.note.cyan{background:rgba(63,216,200,.08);border:1px solid rgba(63,216,200,.22);color:#a6ece4}
.note.red{background:rgba(246,91,91,.08);border:1px solid rgba(246,91,91,.25);color:#f4b0b0}
.note b{color:var(--text)}

/* segmented */
.seg{display:flex;gap:6px;background:var(--panel-3);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px}
.seg button{flex:1;background:none;border:0;color:var(--text-2);font-family:var(--f-body);font-size:12.5px;font-weight:700;padding:9px 6px;border-radius:8px;cursor:pointer;transition:.15s}
.seg button.on{background:linear-gradient(145deg,var(--gold-2),var(--gold-deep));color:#1a1407}
.seg.cyan button.on{background:linear-gradient(145deg,var(--cyan),var(--cyan-deep));color:#04201d}

/* day pills */
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--text-2);font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.3px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
.pill.on{background:linear-gradient(145deg,var(--gold-2),var(--gold-deep));color:#1a1407;border-color:transparent}
.pill.on.cyan{background:linear-gradient(145deg,var(--cyan),var(--cyan-deep));color:#04201d}
.pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* exercise card (lift) */
.ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:13px;overflow:hidden}
.ex-h{display:flex;gap:12px;padding:14px 16px 11px;align-items:flex-start}
.ex-n{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;background:var(--panel-3);color:var(--gold);border:1px solid var(--line-2)}
.ex-ti{flex:1;min-width:0}
.ex-nm{font-size:15.5px;font-weight:700;line-height:1.25}
.ex-tag{font-size:11.5px;margin-top:2px}
.ex-tag.cmp{color:var(--go)}.ex-tag.iso{color:var(--text-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.chip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;background:var(--panel-3);color:var(--text-2);border:1px solid var(--line)}
.chip b{color:var(--text);font-family:var(--f-mono);font-weight:600}
.chip.stretch{background:rgba(157,140,255,.12);border-color:rgba(157,140,255,.3);color:#c5b8ff}
.chip.rir{background:rgba(246,91,91,.1);border-color:rgba(246,91,91,.25);color:#ffb3b3}
.chip.rir b{color:#ff8a8a}
.lastt{margin:0 16px 12px;padding:8px 11px;border-radius:var(--r-sm);background:rgba(255,197,61,.07);border:1px solid rgba(255,197,61,.18);font-size:12px;color:var(--text-2)}
.lastt b{color:var(--gold);font-family:var(--f-mono)}
.hw-tog{display:flex;align-items:center;gap:6px;margin:0 16px 12px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text-3);background:none;border:0;padding:0}
.hw-tog svg{width:14px;height:14px;transition:transform .2s}
.hw-tog.open svg{transform:rotate(90deg)}
.hw-b{display:none;margin:0 16px 14px;padding:13px 14px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r)}
.hw-b.open{display:block}
.hw-b .blk{margin-bottom:10px}.hw-b .blk:last-child{margin-bottom:0}
.hw-b .lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.hw-b .lbl.how{color:var(--gold)}.hw-b .lbl.why{color:var(--go)}
.hw-b p{font-size:12.5px;color:var(--text-2);line-height:1.6}
/* sets table */
.sets{padding:0 12px 14px}
.set-grid{width:100%;border-collapse:collapse}
.set-grid th{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);font-weight:700;padding:4px 5px;text-align:center}
.set-row td{padding:4px 4px}
.set-no{font-family:var(--f-display);font-size:15px;color:var(--text-3);text-align:center;width:30px}
.set-row.done .set-no{color:var(--go)}
.cell{width:100%;background:var(--panel-3);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:var(--f-mono);font-size:16px;font-weight:600;text-align:center;padding:9px 3px;-moz-appearance:textfield}
.cell::-webkit-outer-spin-button,.cell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cell:focus{outline:none;border-color:var(--gold);background:var(--ink-2);box-shadow:0 0 0 3px rgba(255,197,61,.14)}
.cell.filled{border-color:var(--line-2)}
.e1{font-family:var(--f-mono);font-size:10px;color:var(--text-3);text-align:center;white-space:nowrap}
.chk{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--panel-3);cursor:pointer;display:grid;place-items:center;color:transparent;margin:0 auto}
.chk svg{width:15px;height:15px;stroke-width:3}
.chk.on{background:linear-gradient(145deg,var(--go),#1fa85f);border-color:transparent;color:#06231a}
.set-act{display:flex;gap:8px;padding:8px 4px 0}
.mini{flex:1;background:var(--panel-3);border:1px solid var(--line);color:var(--text-2);border-radius:8px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--f-body)}
.mini svg{width:14px;height:14px}
.mini:hover{border-color:var(--line-2);color:var(--text)}

/* run week card */
.rweek{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden}
.rweek.cur{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.rweek-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;cursor:pointer;background:linear-gradient(155deg,var(--panel-2),var(--panel))}
.rweek-h:hover{background:var(--panel-2)}
.rwh-l{display:flex;align-items:center;gap:13px;min-width:0}
.rwh-num{font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--cyan);flex:none}
.rwh-meta h4{font-size:14.5px;font-weight:700}
.rwh-meta p{font-size:11.5px;color:var(--text-3);margin-top:1px}
.rwh-r{font-family:var(--f-mono);font-size:12px;color:var(--text-2);flex:none;text-align:right}
.rwh-chev{color:var(--text-3);transition:transform .25s;flex:none}
.rweek.open .rwh-chev{transform:rotate(90deg)}
.rweek-b{display:none;padding:4px 16px 14px}
.rweek.open .rweek-b{display:block}
.racecallout{margin-top:12px;border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:10px;padding:11px 13px;background:rgba(63,216,200,.05)}
.racecallout.key{border-left-color:var(--gold);background:rgba(255,197,61,.07)}
.racecallout.goal{border-left-color:var(--go);background:rgba(66,215,125,.09)}
.racecallout.taper{border-left-color:var(--warn);background:rgba(240,136,62,.06)}
.racecallout.pr{border-left-color:var(--violet,#9B8CFF)}
.rc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.rc-badge{font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--cyan)}
.racecallout.key .rc-badge{color:var(--gold)}.racecallout.goal .rc-badge{color:var(--go)}.racecallout.taper .rc-badge{color:var(--warn)}
.rc-when{font-family:var(--f-mono);font-size:11px;color:var(--text-3);font-weight:700;flex:none}
.rc-name{font-size:14.5px;font-weight:700;margin-bottom:2px}
.rc-meta{font-size:12px;color:var(--text-2);margin-bottom:6px}
.rc-advice{font-size:12px;color:var(--text-2);line-height:1.55}
.rc-alt{font-size:11.5px;color:var(--text-3);margin-top:5px;font-style:italic}
.runrow{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.runrow:first-child{border-top:0}
.rr-day{flex:none;width:64px;font-family:var(--f-mono);font-size:10.5px;color:var(--text-3);font-weight:600;padding-top:2px;line-height:1.3}
.rr-tag{flex:none;width:8px;border-radius:4px;align-self:stretch}
.rr-tag.easy{background:var(--go)}.rr-tag.quality{background:var(--warn)}.rr-tag.long{background:var(--cyan)}.rr-tag.lift{background:var(--gold)}.rr-tag.rest{background:var(--line-2)}.rr-tag.race{background:var(--danger)}
.rr-body{flex:1;min-width:0}
.rr-t{font-size:13.5px;font-weight:700}
.rr-d{font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.45}

/* calculators */
.input-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-bottom:16px}
.field label{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;background:var(--panel-3);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--f-mono);font-size:16px;font-weight:500;padding:11px 12px}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,197,61,.14)}
.field.full{grid-column:1/-1}
.readout{background:linear-gradient(155deg,var(--panel-2),var(--ink-2));border:1px solid var(--line-2);border-radius:var(--r);padding:18px;margin-top:4px}
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.macro{text-align:center;padding:12px 4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm)}
.macro .mv{font-family:var(--f-mono);font-size:21px;font-weight:600;line-height:1}
.macro .mv.cal{color:var(--gold)}.macro .mv.pro{color:var(--cyan)}.macro .mv.carb{color:var(--go)}.macro .mv.fat{color:var(--warn)}
.macro .ml{font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-top:6px}
.macro .mg{font-size:10.5px;color:var(--text-2);font-family:var(--f-mono);margin-top:2px}
.calc-note{font-size:12.5px;color:var(--text-2);line-height:1.6;padding-top:4px}
.calc-note b{color:var(--text)}
.pace-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pace{padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;gap:8px}
.pace .pn{font-size:12.5px;font-weight:700}
.pace .pn small{display:block;font-size:10.5px;color:var(--text-3);font-weight:500;margin-top:1px}
.pace .pp{font-family:var(--f-mono);font-size:16px;font-weight:600;color:var(--cyan);white-space:nowrap}
.pace.race .pp{color:var(--gold)}

/* gauge */
.gauge-svg{width:100%;height:auto;display:block;overflow:visible}
.gauge-legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:13px;justify-content:center}
.gl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);font-weight:600}
.gl .dot{width:10px;height:10px;border-radius:3px}
.verdict{margin-top:15px;padding:14px 16px;border-radius:var(--r);font-size:13px;line-height:1.6}
.verdict.ok{background:rgba(66,215,125,.09);border:1px solid rgba(66,215,125,.25);color:#a8e9c2}
.verdict.warn{background:rgba(246,91,91,.08);border:1px solid rgba(246,91,91,.25);color:#f4b0b0}
.verdict b{color:var(--text)}

/* tracking */
.track-tabs{display:flex;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.track-tabs::-webkit-scrollbar{display:none}
.track-tabs button{flex:1;min-width:84px;background:none;border:0;color:var(--text-2);font-family:var(--f-body);font-size:12px;font-weight:700;padding:9px 6px;border-radius:8px;cursor:pointer;white-space:nowrap}
.track-tabs button.on{background:var(--panel-3);color:var(--gold)}
.track-pane{display:none}.track-pane.on{display:block}
.quick{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.quick .field{flex:1;min-width:104px;margin:0}
.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:16px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.chart-head h3{font-size:14px;font-weight:700}
.chart-head .chs{font-size:11.5px;color:var(--text-3);font-family:var(--f-mono)}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.log-list{margin-top:4px}
.log-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.log-row .ld{font-family:var(--f-mono);font-size:11.5px;color:var(--text-3);flex:none;width:62px}
.log-row .lv{font-family:var(--f-mono);font-size:16px;font-weight:600;color:var(--gold)}
.log-row .lv.cyan{color:var(--cyan)}
.log-row .lx{flex:1;font-size:12px;color:var(--text-2);font-family:var(--f-mono)}
.log-row .del{background:none;border:0;color:var(--text-3);cursor:pointer;padding:4px}
.log-row .del:hover{color:var(--danger)}
.empty{text-align:center;padding:32px 20px;color:var(--text-3)}
.empty svg{width:38px;height:38px;margin-bottom:12px;opacity:.5}
.empty p{font-size:13.5px;max-width:36ch;margin:0 auto;line-height:1.6}

.btn{border:0;border-radius:var(--r);cursor:pointer;font-family:var(--f-body);font-weight:700;font-size:15px;padding:14px 20px;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.16s;width:100%}
.btn svg{width:18px;height:18px}
.btn-gold{background:linear-gradient(145deg,var(--gold-2),var(--gold-deep));color:#1a1407;box-shadow:var(--glow-gold)}
.btn-cyan{background:linear-gradient(145deg,var(--cyan-2),var(--cyan-deep));color:#04201d;box-shadow:var(--glow-cyan)}
.btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--line-2)}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.landmark-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.lm{text-align:center;padding:12px 4px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm)}
.lm .lmv{font-family:var(--f-mono);font-size:16px;font-weight:600;color:var(--gold)}
.lm .lml{font-size:9px;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-top:4px}
.lm .lmd{font-size:10px;color:var(--text-2);margin-top:2px}

.refs{font-size:11.5px;color:var(--text-3);line-height:1.7}
.refs .r{padding:7px 0;border-top:1px solid var(--line)}
.refs .r:first-child{border-top:0}
.refs b{color:var(--text-2)}
.disclaimer{background:rgba(240,136,62,.07);border:1px solid rgba(240,136,62,.22);border-radius:var(--r);padding:13px 15px;font-size:12.5px;color:#f3c393;line-height:1.6;margin-top:14px}
.disclaimer b{color:var(--warn)}

#toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--line-2);border-radius:999px;padding:11px 20px;font-size:13.5px;font-weight:600;color:var(--text);z-index:200;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;display:flex;align-items:center;gap:8px;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast svg{width:16px;height:16px;flex:none;color:var(--go)}
#toast.cyan svg{color:var(--cyan)}
.storage-warn{display:none;background:rgba(240,136,62,.1);border:1px solid rgba(240,136,62,.3);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:13px;color:#f3c393}
.storage-warn.show{display:block}
.foot-note{text-align:center;color:var(--text-3);font-size:11.5px;padding:22px 0 8px;line-height:1.6}

@media(min-width:760px){
  body{padding-bottom:0}
  nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:6px;padding:8px 16px;background:linear-gradient(180deg,rgba(10,13,20,.97),rgba(10,13,20,.85))}
  .tab{flex:none;flex-direction:row;padding:9px 15px;border-radius:999px;gap:8px}
  .tab span{font-size:13px}
  .tab.active{background:var(--panel)}
  header.app{position:static}
  .input-grid{grid-template-columns:repeat(3,1fr)}
  .view-title{font-size:42px}
  .pace-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:380px){
  .macro-row{grid-template-columns:repeat(2,1fr)}
  .pillars{grid-template-columns:1fr}
  .cd{display:none}
}
/* ---- 7-tab nav fit ---- */
nav.tabs .tab svg{width:20px;height:20px}
nav.tabs .tab span{font-size:8.8px}
nav.tabs .tab{padding:6px 0}
@media(min-width:760px){nav.tabs .tab span{font-size:13px}nav.tabs .tab svg{width:20px;height:20px}}
/* ---- start banner / completion ---- */
.startban{background:linear-gradient(135deg,rgba(63,216,200,.14),rgba(255,197,61,.10));border:1px solid var(--cyan-deep);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.startban .sb-d{flex:none;width:54px;height:54px;border-radius:14px;background:var(--ink-2);border:1px solid var(--cyan-deep);display:flex;flex-direction:column;align-items:center;justify-content:center}
.startban .sb-d b{font-family:var(--f-mono);font-size:20px;color:var(--cyan);line-height:1}
.startban .sb-d small{font-size:8px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-top:2px}
.startban .sb-t h4{font-size:15px;font-weight:800}
.startban .sb-t p{font-size:12.5px;color:var(--text-2);margin-top:2px}
.compbar{display:flex;gap:10px;margin-bottom:16px}
.compcard{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.compcard .cc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.compcard .cc-l{font-size:11px;letter-spacing:.5px;text-transform:uppercase;font-weight:700}
.compcard.lift .cc-l{color:var(--gold)}.compcard.run .cc-l{color:var(--cyan)}
.compcard .cc-v{font-family:var(--f-mono);font-size:13px;color:var(--text-2)}
.dots{display:flex;gap:5px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--panel-3);border:1px solid var(--line)}
.compcard.lift .dots i.on{background:var(--gold);border-color:transparent}
.compcard.run .dots i.on{background:var(--cyan);border-color:transparent}
/* ---- roadmap ---- */
.rm-mile{display:block;font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:8px;margin-top:2px;line-height:1.4}
.rm-mile.race{background:rgba(246,91,91,.13);color:#ffb3b3;border:1px solid rgba(246,91,91,.3)}
.rm-mile.phase{background:rgba(255,197,61,.12);color:#f0d79a;border:1px solid rgba(255,197,61,.3)}
.rm-mile.retest{background:rgba(255,197,61,.12);color:#f0d79a;border:1px solid rgba(255,197,61,.3)}
.rm-mile.health{background:rgba(157,140,255,.13);color:#c5b8ff;border:1px solid rgba(157,140,255,.3)}
.rm-tag{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;margin:3px 4px 0 0}
.rm-tag.deload{background:rgba(63,216,200,.1);color:#a6ece4;border:1px solid rgba(63,216,200,.25)}
.rm-tag.photo{background:var(--panel-3);color:var(--text-2);border:1px solid var(--line)}
.rm-week{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.rm-week.now{background:rgba(255,197,61,.05);margin:0 -16px;padding:9px 16px;border-radius:8px}
.rm-wn{flex:none;width:46px}
.rm-wn b{font-family:var(--f-display);font-size:14px;color:var(--text-2);display:block}
.rm-wn small{font-size:9.5px;color:var(--text-3);font-family:var(--f-mono)}
.rm-wbody{flex:1;min-width:0}
.rm-wtop{display:flex;align-items:center;gap:10px}
.rm-bw{font-family:var(--f-mono);font-size:14px;font-weight:600}
.rm-here{font-size:8.5px;letter-spacing:1px;font-weight:800;color:#1a1407;background:var(--gold);padding:2px 7px;border-radius:5px}
.rm-tags{margin-top:2px}
/* ---- gym tools / warm-up / plate calc ---- */
.tool{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.tool-h{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer}
.tool-h svg.tic{width:18px;height:18px;color:var(--gold);flex:none}
.tool-h h4{flex:1;font-size:14px;font-weight:700}
.tool-h .chev{color:var(--text-3);transition:transform .2s}
.tool.open .tool-h .chev{transform:rotate(90deg)}
.tool-b{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
.tool.open .tool-b{display:block}
.warmblk{font-size:13px;color:var(--text-2);line-height:1.65;padding-top:12px}
.warmblk b{color:var(--text)}
.plate-row{display:flex;gap:10px;margin:12px 0}
.plate-row .field{flex:1;margin:0}
.plate-out{margin-top:6px}
.plate-vis{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;padding:14px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);min-height:64px}
.plate{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;color:#0A0D14;font-family:var(--f-mono);font-weight:700;font-size:12px}
.bar-stub{width:26px;height:8px;background:linear-gradient(180deg,#cfd6e4,#8b94a8);border-radius:2px}
.plate-txt{text-align:center;font-family:var(--f-mono);font-size:13px;color:var(--text-2);margin-top:10px}
.plate-txt b{color:var(--gold)}
.wu-sets{margin-top:12px}
.wu-set{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:6px;font-family:var(--f-mono);font-size:13px}
.wu-set .wu-p{color:var(--text-3);width:42px}
.wu-set .wu-w{color:var(--gold);font-weight:600;flex:1}
.wu-set .wu-r{color:var(--text-2)}
/* ---- rest timer ---- */
#restTimer{position:fixed;left:50%;transform:translateX(-50%) translateY(200px);bottom:calc(72px + env(safe-area-inset-bottom));z-index:120;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--panel-2),var(--ink-2));border:1px solid var(--cyan-deep);border-radius:999px;padding:10px 14px;box-shadow:var(--sh-lg);transition:transform .3s;min-width:230px;justify-content:space-between}
#restTimer.show{transform:translateX(-50%) translateY(0)}
#restTimer button{background:var(--panel-3);border:1px solid var(--line-2);color:var(--text);border-radius:999px;padding:7px 12px;font-family:var(--f-body);font-weight:700;font-size:12px;cursor:pointer}
#restTimer #restEnd{width:30px;padding:7px 0;color:var(--text-3)}
.rt-mid{display:flex;align-items:center;gap:9px}
.rt-lab{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cyan);font-weight:700}
#restTime{font-family:var(--f-mono);font-size:22px;font-weight:600;color:var(--text);min-width:54px;text-align:center}
@media(min-width:760px){#restTimer{bottom:24px}}
/* ---- FUEL tab ---- */
.dose-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.dose{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 10px;text-align:center}
.dose .dn{font-size:10.5px;letter-spacing:.3px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-bottom:5px}
.dose .dv{font-family:var(--f-mono);font-size:17px;font-weight:600;color:var(--go);line-height:1.1}
.dose .dv small{display:block;font-size:9.5px;color:var(--text-3);font-weight:400;margin-top:3px;font-family:var(--f-body)}
.supp-tier{margin-bottom:16px}
.st-label{font-size:12px;font-weight:800;letter-spacing:.3px;padding:7px 12px;border-radius:8px;margin-bottom:10px}
.supp-tier.t1 .st-label{background:rgba(66,215,125,.13);color:#8ce6ad;border:1px solid rgba(66,215,125,.3)}
.supp-tier.t2 .st-label{background:rgba(255,197,61,.12);color:#f0d79a;border:1px solid rgba(255,197,61,.28)}
.supp-tier.t3 .st-label{background:rgba(63,216,200,.12);color:#a6ece4;border:1px solid rgba(63,216,200,.28)}
.supp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.supp-h{display:flex;align-items:center;gap:10px;padding:13px 14px 6px;cursor:pointer}
.supp-ti{flex:1}
.supp-n{font-size:15px;font-weight:700}
.supp-tag{font-size:11.5px;color:var(--text-2);margin-top:1px}
.supp-chev{color:var(--text-3);transition:transform .2s}
.supp-h.open .supp-chev{transform:rotate(90deg)}
.supp-ev{font-size:11px;color:var(--text-3);font-style:italic;padding:0 14px 12px}
.supp-b{display:none;padding:0 14px 14px;gap:12px}
.supp-b.open{display:block}
.supp-b .blk{margin-top:10px}
.mix-grid{display:grid;gap:10px;margin-top:12px}
.mixcard{border-radius:var(--r);padding:13px 14px;border:1px solid var(--line);background:var(--ink-2)}
.mixcard.go{border-color:rgba(66,215,125,.3)}
.mixcard.sep{border-color:rgba(240,136,62,.35)}
.mix-t{font-size:13.5px;font-weight:700;margin-bottom:5px}
.mixcard.go .mix-t{color:#8ce6ad}.mixcard.sep .mix-t{color:var(--warn)}
.mix-items{font-family:var(--f-mono);font-size:13px;color:var(--text);margin-bottom:5px}
.mix-note{font-size:12px;color:var(--text-2);line-height:1.5}
.skip-list{margin-top:10px}
.skip-row{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.skip-row:first-child{border-top:0}
.skip-n{flex:none;width:104px;font-size:13px;font-weight:700;color:#ff9d9d}
.skip-w{flex:1;font-size:12.5px;color:var(--text-2);line-height:1.5}
.price-tbl{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pt-head{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:9px 12px;background:var(--panel-3);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);font-weight:700}
.pt-head span:nth-child(2),.pt-head span:nth-child(3){text-align:right;min-width:62px}
.pt-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:11px 12px;border-top:1px solid var(--line);align-items:center}
.pt-n{font-size:13px;font-weight:600}
.pt-n small{display:block;font-size:11px;color:var(--text-3);font-weight:400;margin-top:2px}
.pt-p{font-family:var(--f-mono);font-size:13px;color:var(--text);text-align:right;min-width:62px}
.pt-g{font-family:var(--f-mono);font-size:13px;color:var(--go);text-align:right;min-width:62px}
.meal-grid{display:grid;gap:10px}
.mealcard{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
.meal-n{font-size:14px;font-weight:700}
.meal-p{font-family:var(--f-mono);font-size:11.5px;color:var(--go);font-weight:600;flex:none}
.meal-d{font-size:12.5px;color:var(--text-2);line-height:1.55}
/* timing schedule */
.timing-list{display:grid;gap:12px;margin-top:14px}
.tblk{border:1px solid var(--line);border-left:3px solid var(--text-3);border-radius:10px;padding:12px 14px;background:var(--ink-2)}
.tblk.morning{border-left-color:var(--gold);background:rgba(255,197,61,.05)}
.tblk.midday{border-left-color:var(--cyan);background:rgba(63,216,200,.05)}
.tblk.evening{border-left-color:var(--violet,#9B8CFF);background:rgba(155,140,255,.06)}
.tblk.occasion{border-left-color:var(--text-3);background:transparent}
.tblk-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tblk-ic{flex:none;display:flex;color:inherit}
.tblk.morning .tblk-ic{color:var(--gold)}.tblk.midday .tblk-ic{color:var(--cyan)}.tblk.evening .tblk-ic{color:var(--violet,#9B8CFF)}.tblk.occasion .tblk-ic{color:var(--text-3)}
.tblk-label{font-size:13.5px;font-weight:800}
.tblk-note{font-size:12px;color:var(--text-2);line-height:1.5;margin-bottom:10px}
.tblk-items{display:grid;gap:9px}
.tblk-item{padding-top:9px;border-top:1px solid rgba(255,255,255,.06)}
.tblk-item:first-child{padding-top:0;border-top:0}
.ti-n{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.ti-d{font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:var(--text-3);margin-left:6px}
.ti-w{font-size:12px;color:var(--text-2);line-height:1.5}
.note.go{background:rgba(66,215,125,.08);border-color:rgba(66,215,125,.3)}
.card-t .ic svg{color:inherit}
/* meal plan */
.mp-days{display:grid;gap:12px;margin-top:14px}
.mp-day{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r)}
.mp-dh{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-bottom:1px solid var(--line)}
.mp-dh span:first-child{font-size:14px;font-weight:800;color:var(--go)}
.mp-tot{font-family:var(--f-mono);font-size:11.5px;color:var(--text-3);font-weight:600}
.mp-meal{padding:10px 13px;border-bottom:1px solid rgba(255,255,255,.04)}
.mp-meal:last-child{border-bottom:0}
.mp-m{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:3px}
.mp-f{font-size:13px;color:var(--text);line-height:1.5}
.mp-macros{font-family:var(--f-mono);font-size:11px;color:var(--text-3);margin-top:4px}
.swap-row{padding:11px 0;border-top:1px solid var(--line)}
.swap-row:first-child{border-top:0}
.swap-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:4px}
.swap-cheap{font-size:13.5px;font-weight:700;color:#8ce6ad}
.swap-pricey{font-size:11.5px;color:var(--text-3)}
@media(min-width:560px){.mp-days{grid-template-columns:1fr 1fr 1fr}}
@media(min-width:520px){.mix-grid{grid-template-columns:1fr 1fr}.meal-grid{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== sleek pass ===== */
.tabs{gap:0!important;padding:6px 0 calc(6px + env(safe-area-inset-bottom))!important;justify-content:space-between!important}
.tab{flex:1 1 0!important;min-width:0;padding:2px 0!important}
.tab span{font-size:10px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tab svg{width:20px;height:20px}
.brand-txt h1{font-size:17px;line-height:1.12}
.cta{width:100%;padding:15px 16px;font-size:16px;font-weight:700;border-radius:14px;margin:-4px 0 14px;letter-spacing:.01em}
.card,.today,.hero{animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 10px 26px rgba(0,0,0,.22)}
button{transition:transform .08s ease,filter .15s ease,background .15s ease,color .15s ease}
button:active,.pill:active,.tab:active{transform:scale(.97)}
.btn-gold:active{filter:brightness(.94)}
.seg button{transition:background .15s,color .15s}
.chip{letter-spacing:.01em}
@media (prefers-reduced-motion:reduce){.card,.today,.hero{animation:none}button,.pill,.tab{transition:none}}

/* ===== sleek pass 2 ===== */
.hero-top>*:first-child{flex:1 1 190px;min-width:0}
.hr-d{font-size:28px}
.brand-txt{min-width:0}
.brand-txt h1{font-size:15px!important;line-height:1.08!important;letter-spacing:-.2px}
.brand-txt span{font-size:8.5px;letter-spacing:1px;white-space:nowrap}
.cell::placeholder{color:var(--text-3);opacity:.85}
.set-row td{vertical-align:middle}

.hero-top{flex-wrap:nowrap!important;align-items:center}
.hero-race{flex:1 1 0!important;min-width:0;max-width:calc(100% - 120px)}
.hr-s{white-space:normal;overflow-wrap:anywhere}
.cd-ring{flex:none;margin-left:auto}
.hr-d{font-size:25px!important;white-space:nowrap}
</style>
</head>
